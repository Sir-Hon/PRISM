<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM — Grading</title>
  <link rel="icon" type="image/png" href="Prismcrys.png"/>
  <link rel="stylesheet" href="portal.css?v=10"/>
  <script src="portal-mobile.js?v=4" defer></script>
  <style>
    :root { --t:#10b981; --t-dark:#059669; --t-light:#d1fae5; }
    .t-btn { padding:.55rem 1.2rem; background:#7c3aed; color:white; border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:700; cursor:pointer; transition:opacity .2s; }
    .t-btn:hover { opacity:.85; }
    .t-select { border:1.5px solid #d1fae5; border-radius:9px; padding:.45rem .75rem; font-family:'DM Sans',sans-serif; font-size:.85rem; color:#374151; outline:none; background:#fff; }
    .class-bar { background:#fff; border-radius:14px; padding:.7rem 1.3rem; box-shadow:0 4px 18px rgba(124,58,237,.07); border:1px solid rgba(124,58,237,.09); margin-bottom:1.5rem; display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
    .section-pills { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; }
    .section-pill { padding:.38rem .9rem; border-radius:20px; border:1.5px solid #d1fae5; background:#fff; color:#6b7280; font-size:.82rem; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all .15s; }
    .section-pill:hover { border-color:var(--t); color:var(--t); }
    .section-pill.active { background:var(--t); color:#fff; border-color:var(--t); }
    .type-pills { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1.5rem; }
    .type-pill { padding:.45rem 1.1rem; border-radius:20px; border:1.5px solid #e4dffa; background:#fff; color:#6b7280; font-size:.85rem; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all .15s; }
    .type-pill:hover { border-color:#7c3aed; color:#7c3aed; }
    .type-pill.active { background:#7c3aed; color:#fff; border-color:#7c3aed; }
    .t-card { background:#fff; border-radius:18px; padding:1.6rem; box-shadow:0 4px 24px rgba(124,58,237,.08); border:1px solid rgba(124,58,237,.07); margin-bottom:1.2rem; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; padding:.5rem .9rem; font-size:.7rem; font-weight:700; color:#9ca3af; text-transform:uppercase; letter-spacing:.06em; border-bottom:2px solid #f0ecff; }
    td { padding:.65rem .9rem; font-size:.88rem; color:#374151; border-bottom:1px solid #f9f9f9; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#faf9ff; }
    .review-modal { display:none; position:fixed; inset:0; background:rgba(10,10,20,.75); backdrop-filter:blur(8px); z-index:9999; align-items:center; justify-content:center; overflow-y:auto; padding:1.5rem; }
    .review-modal.active { display:flex; }
    /* Submission attachments — Classroom-style list */
    .gc-files-section { background:#f1f3f4; border-radius:12px; padding:.85rem 1rem; margin-top:.85rem; }
    .gc-files-label { font-size:.72rem; font-weight:700; color:#5f6368; letter-spacing:.06em; text-transform:uppercase; margin-bottom:.65rem; }
    .gc-attach-card { display:flex; align-items:stretch; gap:0; background:#fff; border-radius:10px; border:1px solid #dadce0; margin-bottom:.5rem; overflow:hidden; transition:box-shadow .15s; }
    .gc-attach-card:last-child { margin-bottom:0; }
    .gc-attach-card:hover { box-shadow:0 1px 6px rgba(60,64,67,.15); }
    .gc-attach-bar { width:4px; flex-shrink:0; background:#1a73e8; }
    .gc-attach-preview { width:100px; min-height:76px; flex-shrink:0; background:#e8eaed; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; }
    .gc-attach-preview img { width:100%; height:100%; max-height:104px; object-fit:cover; }
    .gc-attach-preview.gc-doc { cursor:pointer; font-size:1.85rem; }
    .gc-attach-body { flex:1; min-width:0; padding:.65rem .85rem; display:flex; flex-direction:column; justify-content:center; gap:.35rem; }
    .gc-attach-name { font-size:.86rem; font-weight:600; color:#202124; word-break:break-word; line-height:1.35; }
    .gc-attach-actions { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; }
    .gc-attach-open { padding:.28rem .75rem; border-radius:6px; border:1px solid #dadce0; background:#fff; font-size:.74rem; font-weight:600; color:#1a73e8; cursor:pointer; font-family:'DM Sans',sans-serif; }
    .gc-attach-open:hover { background:#f8f9fa; }
    .gc-attach-dl { font-size:.72rem; font-weight:600; color:#5f6368; text-decoration:none; }
    .gc-attach-dl:hover { color:#1a73e8; text-decoration:underline; }
    .gc-link-row { display:flex; align-items:stretch; gap:0; background:#fff; border:1px solid #dadce0; border-radius:10px; margin-bottom:.5rem; overflow:hidden; }
    .gc-link-row .gc-attach-bar { width:4px; flex-shrink:0; background:#1a73e8; }
    .gc-link-body { flex:1; min-width:0; padding:.65rem .85rem; }
    .gc-link-body a { font-size:.82rem; font-weight:600; color:#1a73e8; word-break:break-all; }
    .roster-thumbs { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; }
    .roster-thumb { width:44px; height:44px; object-fit:cover; border-radius:8px; border:1px solid #e4dffa; cursor:pointer; background:#f3f4f6; display:block; }
    .roster-thumb-lg { width:72px; height:72px; }
    .roster-file-chip { display:inline-flex; align-items:center; gap:.25rem; padding:.2rem .5rem; border-radius:8px; border:1px solid #e4dffa; background:#faf9ff; font-size:.72rem; font-weight:700; color:#5b21b6; cursor:pointer; font-family:'DM Sans',sans-serif; text-decoration:none; }
    .student-avatar { background:linear-gradient(135deg,#7c3aed,#a78bfa); color:#fff; font-size:.72rem; font-weight:800; font-family:'DM Sans',sans-serif; }
  </style>
</head>
<body>
<script src="api.js?v=9"></script>
<script src="script.js?v=10"></script>
<script src="portal-sidebar.js?v=11"></script>
<div class="topbar">
  <a class="topbar-logo" href="teacher.html"><div class="topbar-logo-gem"><img src="Prismcrys.png" style="width:100%;height:100%;object-fit:contain;display:block;" alt="PRISM"/></div>PRISM</a>
  <div class="topbar-spacer"></div>
  <div class="topbar-right">
    <span class="topbar-role-badge" id="topbar-role"></span>
    <span class="topbar-name" id="topbar-name"></span>
    <a class="topbar-avatar" href="profile.html" id="topbar-avatar">T</a>
  </div>
</div>

<div class="app-layout">
  <aside class="sidebar">
    <div id="sidebar-user-card" class="sidebar-user-card"></div>
    <div id="sidebar-nav"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Classes</div>
      <div id="sidebar-classes"></div>
    </div>
    <div style="margin-top:auto;padding-top:1rem;">
      <div class="sidebar-divider"></div>
      <button type="button" class="sidebar-logout">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1> Grading</h1>
      <p>Review student work and award scores. For assignments, open <strong>View work</strong> to see uploads, links, and written responses—then save the score in the modal or in the table.</p>
    </div>

    <div class="class-bar">
      <span style="font-size:.82rem;font-weight:700;color:#9ca3af;"> Class:</span>
      <select id="class-select" class="t-select" onchange="onClassChange(this.value)" style="min-width:220px;font-weight:600;"></select>
    </div>

    <div id="grading-section-wrap" style="display:none;margin-bottom:1rem;">
      <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin-bottom:.5rem;">Filter by Section</div>
      <div class="section-pills" id="section-pills-grading"></div>
    </div>

    <div id="grading-asgn-filter-wrap" style="display:none;margin-bottom:1rem;padding:.65rem 1rem;background:#faf9ff;border-radius:12px;border:1.5px solid #e4dffa;">
      <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin-bottom:.45rem;">Filter by assignment</div>
      <select id="grading-asgn-filter-select" class="t-select" style="min-width:260px;max-width:100%;font-weight:600;"></select>
    </div>

    <div id="grading-qa-filter-wrap" style="display:none;margin-bottom:1rem;padding:.65rem 1rem;background:#faf9ff;border-radius:12px;border:1.5px solid #e4dffa;">
      <div style="font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#9ca3af;margin-bottom:.45rem;" id="grading-qa-filter-label">Filter by quiz</div>
      <select id="grading-qa-filter-select" class="t-select" style="min-width:260px;max-width:100%;font-weight:600;"></select>
    </div>

    <div class="type-pills">
      <button class="type-pill active" onclick="switchType('quiz',this)"> Quizzes &amp; Exams</button>
      <button class="type-pill" onclick="switchType('activity',this)"> Activities</button>
      <button class="type-pill" onclick="switchType('assignment',this)"> Assignments</button>
    </div>

    <div id="grading-content"></div>
  </main>
</div>

<!-- Quiz Review Modal -->
<div class="review-modal" id="review-modal">
  <div id="review-inner" style="background:#f8f7ff;border-radius:22px;width:700px;max-width:96vw;box-shadow:0 24px 70px rgba(0,0,0,.28);display:flex;flex-direction:column;max-height:90vh;"></div>
</div>


<script src="pages/grading.js?v=11"></script>
</body>
</html>
