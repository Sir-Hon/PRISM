<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM � Quizzes</title>
  <link rel="icon" type="image/png" href="Prismcrys.png"/>
  <link rel="stylesheet" href="portal.css?v=25"/>
  <script src="portal-mobile.js?v=4" defer></script>
  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    /* -- QUIZ CARDS -- */
    .quiz-filter-row { display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1.8rem; }
    .q-filter-btn { padding:.5rem 1.1rem; border-radius:20px; border:1.5px solid #e4dffa; background:#f5f2eb; color:#6b7280; font-size:.88rem; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all .15s; }
    .q-filter-btn:hover         { border-color:#a78bfa; color:#7c3aed; }
    .q-filter-btn.active        { background:#7c3aed; color:white; border-color:#7c3aed; }

    .quizzes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr)); gap:1.4rem; }
    @media (max-width:640px) {
      .quizzes-grid { gap: 0.9rem; }
      .quiz-card-body { padding: 1.05rem 1rem; }
      .quiz-card:hover { transform: none; }
    }

    .quiz-card {
      background:#f5f2eb; border-radius:18px; overflow:hidden;
      box-shadow:0 4px 24px rgba(124,58,237,.10); border:1px solid rgba(124,58,237,.09);
      cursor:pointer; transition:transform .22s, box-shadow .22s;
      animation:fadeUp .4s ease both;
    }
    .quiz-card:nth-child(1){animation-delay:.04s} .quiz-card:nth-child(2){animation-delay:.09s}
    .quiz-card:nth-child(3){animation-delay:.14s} .quiz-card:nth-child(4){animation-delay:.19s}
    .quiz-card:hover { transform:translateY(-5px); box-shadow:0 12px 36px rgba(124,58,237,.18); }

    .quiz-card-banner {
      height:10px;
    }

    .quiz-card-body { padding:1.4rem 1.5rem; }

    .quiz-subject-badge { display:inline-flex; align-items:center; gap:.4rem; font-size:.78rem; font-weight:700; color:#7c3aed; background:#ede9fe; padding:4px 11px; border-radius:20px; margin-bottom:.9rem; }

    .quiz-title { font-family:'DM Sans',sans-serif; font-size:1.15rem; font-weight:800; color:#16132b; margin-bottom:.5rem; line-height:1.3; }

    .quiz-meta { display:flex; gap:1rem; flex-wrap:wrap; margin-bottom:1.1rem; }
    .quiz-meta-item { display:flex; align-items:center; gap:.35rem; font-size:.85rem; color:#6b7280; }

    .quiz-status { display:inline-flex; align-items:center; gap:.4rem; font-size:.8rem; font-weight:700; padding:5px 13px; border-radius:20px; }
    .quiz-status.not-started { background:#f0ecff; color:#7c3aed; }
    .quiz-status.in-progress { background:#fef3c7; color:#d97706; }
    .quiz-status.completed   { background:#d1fae5; color:#065f46; }
    .quiz-status.overdue     { background:#fee2e2; color:#dc2626; }

    .start-quiz-btn {
      display:block; width:100%; padding:.72rem; border:none; border-radius:12px;
      background:linear-gradient(135deg,#7c3aed,#6d28d9); color:white;
      font-family:'DM Sans',sans-serif; font-size:.97rem; font-weight:700;
      cursor:pointer; transition:opacity .2s, transform .15s; margin-top:1.1rem;
    }
    .start-quiz-btn:hover { opacity:.9; transform:translateY(-1px); }
    .start-quiz-btn.done  { background:linear-gradient(135deg,#10b981,#059669); }
    .start-quiz-btn.over  { background:#e5e7eb; color:#9ca3af; pointer-events:none; }
    .start-quiz-btn.late-deadline { background:#fee2e2; color:#991b1b; border:1.5px solid #fecaca; pointer-events:auto; cursor:pointer; }

    /* -- QUIZ MODAL -- */
    .qz-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); z-index:500; align-items:center; justify-content:center; }
    .qz-overlay.active { display:flex; }

    .qz-modal {
      background:#f5f2eb; border-radius:22px; width:620px; max-width:94vw; max-height:90vh;
      overflow-y:auto; box-shadow:0 24px 70px rgba(0,0,0,.22);
      animation:popIn .28s cubic-bezier(.34,1.56,.64,1);
    }

    @keyframes popIn { from{transform:scale(.88);opacity:0} to{transform:scale(1);opacity:1} }

    .qz-modal-header { padding:2rem 2rem 1.2rem; border-bottom:1px solid #f0ecff; position:sticky; top:0; background:#f5f2eb; z-index:2; border-radius:22px 22px 0 0; }
    .qz-modal-header h2 { font-family:'DM Sans',sans-serif; font-size:1.35rem; font-weight:800; color:#16132b; margin-bottom:.3rem; }
    .qz-modal-header p  { font-size:.9rem; color:#9ca3af; margin:0; }

    .qz-progress-bar-wrap { height:7px; background:#f0ecff; border-radius:10px; margin:1.1rem 2rem .5rem; }
    .qz-progress-bar      { height:100%; background:linear-gradient(90deg,#7c3aed,#a78bfa); border-radius:10px; transition:width .4s ease; }

    .qz-body { padding:1.5rem 2rem 2rem; }

    .qz-question { font-size:1.08rem; font-weight:700; color:#16132b; margin-bottom:1.3rem; line-height:1.55; }
    .qz-q-num   { font-size:.8rem; font-weight:700; color:#a78bfa; text-transform:uppercase; letter-spacing:.07em; margin-bottom:.5rem; }

    .qz-choices { display:flex; flex-direction:column; gap:.7rem; }
    .qz-choice  {
      display:flex; align-items:center; gap:.9rem; padding:.95rem 1.2rem;
      border:2px solid #e4dffa; border-radius:13px; cursor:pointer;
      transition:all .18s; background:#faf9ff; font-size:.97rem; color:#374151; font-weight:500;
    }
    .qz-choice:hover:not(.selected):not(.correct):not(.wrong) { border-color:#a78bfa; background:#f5f3ff; }
    .qz-choice.selected { border-color:#7c3aed; background:#ede9fe; color:#5b21b6; font-weight:700; }
    .qz-choice.correct  { border-color:#10b981; background:#d1fae5; color:#065f46; font-weight:700; }
    .qz-choice.wrong    { border-color:#ef4444; background:#fee2e2; color:#991b1b; font-weight:700; }

    .qz-choice-letter { width:32px; height:32px; border-radius:50%; background:#e4dffa; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.88rem; color:#7c3aed; flex-shrink:0; font-family:'DM Sans',sans-serif; }
    .qz-choice.selected .qz-choice-letter { background:#7c3aed; color:#fff; }
    .qz-choice.correct  .qz-choice-letter { background:#10b981; color:#fff; }
    .qz-choice.wrong    .qz-choice-letter { background:#ef4444; color:#fff; }

    .qz-feedback { margin-top:1.1rem; padding:.9rem 1.2rem; border-radius:12px; font-size:.92rem; font-weight:600; display:none; }
    .qz-feedback.correct { background:#d1fae5; color:#065f46; display:block; }
    .qz-feedback.wrong   { background:#fee2e2; color:#991b1b; display:block; }

    .qz-nav { display:flex; justify-content:space-between; align-items:center; margin-top:1.8rem; }
    .qz-nav-btn { padding:.65rem 1.6rem; border:none; border-radius:12px; font-size:.95rem; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all .18s; }
    .qz-nav-btn.prev { background:#f0ecff; color:#7c3aed; }
    .qz-nav-btn.next { background:#7c3aed; color:#fff; }
    .qz-nav-btn.next:hover { background:#6d28d9; }
    .qz-nav-btn.prev:hover { background:#e4dffa; }
    .qz-nav-btn:disabled   { opacity:.4; pointer-events:none; }

    .qz-score-card { text-align:center; padding:2.5rem 2rem; }
    .qz-score-big  { font-family:'DM Sans',sans-serif; font-size:4rem; font-weight:800; color:#7c3aed; margin-bottom:.5rem; }
    .qz-score-sub  { font-size:1.05rem; color:#6b7280; margin-bottom:1.8rem; }
    .qz-score-msg  { font-size:1.15rem; font-weight:700; color:#16132b; margin-bottom:1.5rem; }
    .qz-retry-btn  { padding:.78rem 2.2rem; border:none; border-radius:13px; background:#7c3aed; color:#fff; font-family:'DM Sans',sans-serif; font-size:1rem; font-weight:700; cursor:pointer; transition:opacity .2s; }
    .qz-retry-btn:hover { opacity:.88; }
    .qz-close-btn  { position:absolute; top:1.2rem; right:1.5rem; background:#f0ecff; border:none; width:34px; height:34px; border-radius:50%; font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#555; z-index:3; }
    .qz-close-btn:hover { background:#e4dffa; }
    .qz-modal { position:relative; }
    .qz-q-img { display:block; max-width:100%; max-height:240px; object-fit:contain; border-radius:12px; margin:0 0 .9rem; background:#faf8ff; }
    .qz-write { width:100%; box-sizing:border-box; border:1.5px solid #e4dffa; border-radius:12px; padding:.85rem 1rem; font-size:.98rem; font-family:DM Sans,sans-serif; color:#16132b; outline:none; background:#f5f2eb; }
    textarea.qz-write { min-height:120px; resize:vertical; }
    .mtf-line { display:flex; align-items:flex-start; gap:.75rem; }
    .mtf-blank { width:148px; flex-shrink:0; border:none; border-bottom:2px solid #7c3aed; background:#faf8ff; border-radius:10px 10px 0 0; padding:.7rem .75rem; font-size:1rem; font-weight:700; color:#16132b; }
    .mtf-stem { font-size:1.02rem; font-weight:700; color:#16132b; line-height:1.5; padding-top:.55rem; }
    .mtf-no { color:#7c3aed; margin-right:.35rem; }
    .qz-part { margin:0 0 1rem; }
    .qz-part-kicker { font-family:DM Sans,sans-serif; font-size:1.05rem; font-weight:800; color:#16132b; }
    .qz-part-dir { margin-top:.25rem; color:#4b5563; font-size:.92rem; line-height:1.45; }
    .qz-bank { display:flex; flex-wrap:wrap; gap:.45rem; margin-top:.7rem; padding:.7rem; border:1.5px dashed #c4b5fd; border-radius:12px; background:#faf8ff; }
    .qz-bank-word { border:1px solid #ddd6fe; background:#f5f2eb; color:#5b21b6; border-radius:8px; padding:.35rem .65rem; font-family:DM Sans,sans-serif; font-size:.86rem; font-weight:700; cursor:pointer; }
    .qz-bank-word:hover { background:#ede9fe; }
    .match-connect { position:relative; display:grid; grid-template-columns:1fr 1fr; gap:2.4rem; align-items:start; }
    .match-lines { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; overflow:visible; grid-column:1 / -1; grid-row:1 / -1; }
    .match-item.b.is-drop { border-color:#7c3aed; background:#ede9fe; }
    .match-col { display:flex; flex-direction:column; gap:.65rem; position:relative; z-index:1; min-width:0; }
    .match-col h4 { margin:0 0 .15rem; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:#7c3aed; }
    .match-item { display:flex; align-items:center; gap:.55rem; background:#faf9ff; border:1.5px solid #e9d5ff; border-radius:12px; padding:.6rem .7rem; color:#16132b; min-height:46px; }
    .match-item span { flex:1; min-width:0; font-size:.92rem; font-weight:600; line-height:1.35; }
    .match-item.a { flex-direction:row; }
    .match-item.b { flex-direction:row; }
    .match-dot { width:18px; height:18px; border-radius:50%; border:3px solid #7c3aed; background:#f5f2eb; padding:0; cursor:grab; flex-shrink:0; touch-action:none; position:relative; z-index:3; }
    .match-dot.used { background:var(--dot,#7c3aed); }
    .match-hint { margin:.7rem 0 0; font-size:.75rem; color:#6b7280; line-height:1.4; }
    html[data-theme="dark"] #shared-qz-modal [style*="color:#16132b"],
    html[data-theme="dark"] #shared-qz-modal [style*="color:#374151"],
    html[data-theme="dark"] #shared-qz-modal .match-item,
    html[data-theme="dark"] #shared-qz-modal .match-hint {
      color:#16132b !important;
    }
    @media (max-width:640px) {
      .match-connect { gap:1.3rem; }
      .match-item { padding:.5rem .45rem; }
      .match-item span { font-size:.82rem; }
    }
    .qz-missing { background:#fff7ed; border:1.5px solid #fdba74; color:#9a3412; border-radius:12px; padding:.85rem 1rem; margin-bottom:1rem; }
    .qz-missing strong { display:block; font-size:.95rem; }
    .qz-missing p { margin:.25rem 0 .45rem; font-size:.82rem; }
    .qz-missing button { display:block; width:100%; text-align:left; margin-top:.35rem; background:#f5f2eb; border:1px solid #fdba74; border-radius:8px; padding:.45rem .65rem; color:#9a3412; font-weight:700; cursor:pointer; font-family:DM Sans,sans-serif; }
    .qz-pills { display:flex; flex-wrap:wrap; gap:.35rem; margin-bottom:.9rem; }
    .qz-pill { width:32px; height:32px; border-radius:8px; border:1.5px solid #e4dffa; background:#f5f2eb; font-weight:800; cursor:pointer; color:#6b7280; font-family:DM Sans,sans-serif; }
    .qz-pill.on { background:#ede9fe; border-color:#c4b5fd; color:#6d28d9; }
    .qz-pill.now { background:#7c3aed; color:#fff; border-color:#7c3aed; }
    .qz-pill.need { border-color:#f97316; color:#c2410c; }
  </style>
</head>
<body>
<script src="api.js?v=29"></script>
<script src="script.js?v=18"></script>
<script src="portal-sidebar.js?v=23"></script>
<div class="topbar">
  <a class="topbar-logo" href="index.html"><div class="topbar-logo-gem"><img src="Prismcrys.png" style="width:100%;height:100%;object-fit:contain;display:block;" alt="PRISM"/></div>PRISM</a>
  <div class="topbar-spacer"></div>
  <div class="topbar-right">
    <span class="topbar-role-badge" id="topbar-role"></span>
    <span class="topbar-name" id="topbar-name"></span>
    <a class="topbar-avatar" href="profile.html" id="topbar-avatar">U</a>
  </div>
</div>

<div class="app-layout">
  <aside class="sidebar">
    <div id="sidebar-user-card" class="sidebar-user-card"></div>
    <div id="sidebar-nav"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">My Classes</div>
      <div id="sidebar-classes"></div>
    </div>
    <div style="margin-top:auto;padding-top:1rem;">
      <div class="sidebar-divider"></div>
      <button type="button" class="sidebar-logout">Logout</button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1> Quizzes</h1>
      <p>Practice quizzes for all your enrolled subjects.</p>
    </div>

    <div class="quiz-filter-row">
      <button class="q-filter-btn active" onclick="filterQuizzes('all',this)">All Quizzes</button>
      <button class="q-filter-btn" onclick="filterQuizzes('pending',this)">Pending</button>
      <button class="q-filter-btn" onclick="filterQuizzes('completed',this)">Completed</button>
      <button class="q-filter-btn" onclick="filterQuizzes('overdue',this)">Overdue</button>
    </div>

    <div class="quizzes-grid" id="quizzes-grid"></div>
  </main>
</div>

</html>
