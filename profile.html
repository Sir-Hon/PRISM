<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>PRISM My Profile</title>
 <link rel="icon" type="image/png" href="Prismcrys.png"/>
 <link rel="stylesheet" href="portal.css?v=11"/>
 <script src="portal-mobile.js?v=4" defer></script>
 <style>
 @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
 @keyframes popIn { from{transform:scale(.88);opacity:0} to{transform:scale(1);opacity:1} }
 @keyframes fillBar { from{width:0} to{width:var(--w)} }
 @keyframes countUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

 /* PROFILE HERO */
 .profile-hero {
 background: linear-gradient(135deg, #16122a 0%, #2d1f5e 50%, #4c2889 100%);
 border-radius: 22px;
 padding: 2.8rem 2.5rem 2.2rem;
 color: white;
 position: relative;
 overflow: hidden;
 margin-bottom: 1.8rem;
 animation: fadeUp .45s ease;
 }

 .profile-hero::before {
 content: '';
 position: absolute; inset: 0;
 background-image: repeating-linear-gradient(60deg,
 rgba(255,255,255,.04) 0, rgba(255,255,255,.04) 2px,
 transparent 2px, transparent 28px);
 }

 .profile-hero-inner {
 position: relative; z-index: 1;
 display: flex; align-items: flex-end; gap: 2rem; flex-wrap: wrap;
 }

 /* Avatar with camera edit button */
 .profile-avatar-wrap { position: relative; flex-shrink: 0; }

 .profile-avatar {
 width: 110px; height: 110px;
 border-radius: 50%;
 background: linear-gradient(135deg, #7c3aed, #a78bfa);
 display: flex; align-items: center; justify-content: center;
 font-family: 'DM Sans', sans-serif;
 font-size: 2.8rem; font-weight: 800;
 color: white;
 border: 4px solid rgba(255,255,255,.25);
 box-shadow: 0 8px 30px rgba(0,0,0,.3);
 overflow: hidden;
 cursor: pointer;
 transition: transform .2s, box-shadow .2s;
 }
 .profile-avatar:hover { transform: scale(1.04); box-shadow: 0 12px 40px rgba(0,0,0,.4); }
 .profile-avatar img { width:100%; height:100%; object-fit:cover; display:none; }

 .avatar-edit-btn {
 position: absolute; bottom: 4px; right: 4px;
 width: 30px; height: 30px; border-radius: 50%;
 background: #7c3aed; border: 2px solid white;
 color: white; font-size: .8rem;
 display: flex; align-items: center; justify-content: center;
 cursor: pointer; transition: background .2s;
 }
 .avatar-edit-btn:hover { background: #6d28d9; }
 #avatar-upload { display: none; }

 /* Profile info */
 .profile-info { flex: 1; min-width: 200px; }

 .profile-name {
 font-family: 'DM Sans', sans-serif;
 font-size: 2rem; font-weight: 800;
 margin-bottom: .4rem; line-height: 1.2;
 }

 .profile-id {
 font-size: .92rem; color: rgba(255,255,255,.6);
 font-family: monospace; margin-bottom: .8rem;
 }

 .profile-badges { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }

 .p-badge {
 font-size: .75rem; font-weight: 700;
 padding: 4px 13px; border-radius: 20px;
 backdrop-filter: blur(6px);
 }
 .p-badge.role { background: rgba(124,58,237,.4); border: 1px solid rgba(167,139,250,.4); color: #ddd6fe; }
 .p-badge.section { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2); color: rgba(255,255,255,.85); }
 .p-badge.standing { background: rgba(16,185,129,.25); border: 1px solid rgba(16,185,129,.4); color: #6ee7b7; }

 /* Stats row inside hero */
 .hero-stats {
 display: flex; gap: 1.8rem; flex-wrap: wrap;
 padding-top: 1.4rem; margin-top: 1.4rem;
 border-top: 1px solid rgba(255,255,255,.12);
 width: 100%;
 }

 .hero-stat { text-align: center; }
 .hero-stat .hs-val { font-family:'DM Sans',sans-serif; font-size:1.8rem; font-weight:800; color:white; line-height:1; }
 .hero-stat .hs-lbl { font-size:.75rem; color:rgba(255,255,255,.55); margin-top:.3rem; text-transform:uppercase; letter-spacing:.06em; }

 /* Edit profile btn */
 .edit-profile-btn {
 position: absolute; top: 1.5rem; right: 1.8rem; z-index: 2;
 background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
 color: white; padding: .5rem 1.2rem; border-radius: 20px;
 font-size: .88rem; font-weight: 600; cursor: pointer;
 font-family: 'DM Sans', sans-serif;
 transition: background .2s;
 display: flex; align-items: center; gap: .4rem;
 }
 .edit-profile-btn:hover { background: rgba(255,255,255,.22); }

 /* GRID LAYOUT */
 .profile-grid {
 display: grid;
 grid-template-columns: 320px 1fr;
 gap: 1.5rem;
 align-items: start;
 }

 @media(max-width:900px) { .profile-grid { grid-template-columns: 1fr; } }
 @media(max-width:640px) {
 .profile-hero { padding: 1.25rem 1.05rem 1.1rem; border-radius: 16px; }
 .edit-profile-btn { position: static; margin-bottom: 0.9rem; }
 .profile-hero-inner { gap: 0.9rem; }
 .profile-avatar { width: 84px; height: 84px; font-size: 2rem; }
 .profile-name { font-size: 1.45rem; }
 .hero-stats { gap: 1rem; }
 }

 /* CARDS */
 .p-card {
 background: #fff;
 border-radius: 18px;
 box-shadow: 0 4px 24px rgba(124,58,237,.09);
 border: 1px solid rgba(124,58,237,.08);
 overflow: hidden;
 animation: fadeUp .4s ease both;
 }
 .p-card:nth-child(1){animation-delay:.05s}
 .p-card:nth-child(2){animation-delay:.10s}
 .p-card:nth-child(3){animation-delay:.15s}
 .p-card:nth-child(4){animation-delay:.20s}
 .p-card:nth-child(5){animation-delay:.25s}

 .p-card-header {
 padding: 1.2rem 1.5rem .8rem;
 border-bottom: 1px solid #f0ecff;
 display: flex; align-items: center; justify-content: space-between;
 }
 .p-card-title {
 font-family: 'DM Sans', sans-serif;
 font-size: 1rem; font-weight: 800; color: #16132b;
 display: flex; align-items: center; gap: .5rem;
 }
 .p-card-body { padding: 1.2rem 1.5rem; }

 /* INFO LIST */
 .info-row {
 display: flex; align-items: flex-start;
 gap: .9rem; padding: .65rem 0;
 border-bottom: 1px solid #f9f8ff;
 }
 .info-row:last-child { border-bottom: none; }
 .info-icon { display: none; }
 .info-label { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: #c4b5fd; margin-bottom: .15rem; }
 .info-value { font-size: .95rem; font-weight: 600; color: #16132b; }
 .info-value.editable-field { cursor: text; border-bottom: 1.5px dashed #e4dffa; padding-bottom: 1px; transition: border-color .2s; }
 .info-value.editable-field:focus { outline: none; border-bottom-color: #7c3aed; }

 /* SUBJECT PROGRESS */
 .subject-row { margin-bottom: 1.1rem; }
 .subject-row:last-child { margin-bottom: 0; }

 .subject-label-row {
 display: flex; align-items: center; justify-content: space-between;
 margin-bottom: .45rem;
 }

 .subject-name-dot {
 display: flex; align-items: center; gap: .55rem;
 font-size: .92rem; font-weight: 700; color: #16132b;
 }

 .subj-diamond {
 flex-shrink: 0;
 }

 .subject-pct { font-size: .82rem; font-weight: 700; color: #7c3aed; }

 .progress-track {
 height: 8px; background: #f0ecff; border-radius: 10px; overflow: hidden;
 }
 .progress-fill {
 height: 100%; border-radius: 10px;
 animation: fillBar .9s ease forwards;
 --w: 0%;
 }

 /* QUIZ STATUS */
 .quiz-status-list { display: flex; flex-direction: column; gap: .65rem; }

 .qz-row {
 display: flex; align-items: center; gap: .9rem;
 padding: .85rem 1rem;
 border-radius: 13px;
 border: 1.5px solid #f0ecff;
 background: #faf9ff;
 transition: border-color .18s;
 cursor: pointer;
 }
 .qz-row:hover { border-color: #c4b5fd; }

 .qz-dot {
 width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
 }

 .qz-info { flex: 1; overflow: hidden; }
 .qz-info .qz-name { font-size: .92rem; font-weight: 700; color: #16132b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 .qz-info .qz-sub { font-size: .76rem; color: #9ca3af; margin-top: 1px; }

 .qz-score-badge {
 font-size: .78rem; font-weight: 700; padding: 4px 11px;
 border-radius: 20px; white-space: nowrap; flex-shrink: 0;
 }
 .qz-score-badge.done { background: #d1fae5; color: #065f46; }
 .qz-score-badge.missed { background: #fee2e2; color: #991b1b; }
 .qz-score-badge.pending { background: #fef3c7; color: #92400e; }
 .qz-score-badge.overdue { background: #fee2e2; color: #991b1b; }

 /* ASSIGNMENTS */
 .asgn-list { display: flex; flex-direction: column; gap: .6rem; }

 .asgn-row {
 display: flex; align-items: center; gap: .9rem;
 padding: .82rem 1rem; border-radius: 13px;
 border: 1.5px solid #f0ecff; background: #faf9ff;
 cursor: pointer; transition: border-color .18s;
 }
 .asgn-row:hover { border-color: #c4b5fd; }
 .asgn-row.overdue { border-color: #fecaca; background: #fff5f5; }

 .asgn-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
 .asgn-info { flex: 1; overflow: hidden; }
 .asgn-info .asgn-title { font-size: .92rem; font-weight: 700; color: #16132b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
 .asgn-info .asgn-subject { font-size: .76rem; color: #9ca3af; }
 .asgn-due { font-size: .78rem; font-weight: 700; white-space: nowrap; }
 .asgn-due.ok { color: #7c3aed; }
 .asgn-due.overdue { color: #ef4444; }

 /* ACTIVITY FEED */
 .activity-feed { display: flex; flex-direction: column; }

 .activity-item {
 display: flex; gap: 1rem; padding: .9rem 0;
 border-bottom: 1px solid #f9f8ff;
 }
 .activity-item:last-child { border-bottom: none; }

 .activity-icon-wrap {
 width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
 display: flex; align-items: center; justify-content: center;
 font-size: 1rem;
 }

 .activity-text { flex: 1; }
 .activity-text .act-main { font-size: .92rem; color: #374151; line-height: 1.45; }
 .activity-text .act-main strong { color: #16132b; font-weight: 700; }
 .activity-text .act-time { font-size: .76rem; color: #c4b5fd; margin-top: .2rem; }

 /* SUMMARY STAT CHIPS */
 .stat-chips { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }

 .stat-chip {
 background: #faf9ff; border-radius: 14px;
 border: 1.5px solid #f0ecff;
 padding: 1.1rem 1rem;
 text-align: center;
 }
 .stat-chip .sc-val { font-family:'DM Sans',sans-serif; font-size:1.6rem; font-weight:800; color:#7c3aed; line-height:1; }
 .stat-chip .sc-lbl { font-size:.75rem; color:#9ca3af; margin-top:.3rem; font-weight:600; }
 .stat-chip.red .sc-val { color:#ef4444; }
 .stat-chip.green .sc-val { color:#10b981; }
 .stat-chip.amber .sc-val { color:#d97706; }

 /* EDIT MODAL */
 .edit-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); backdrop-filter:blur(6px); z-index:600; align-items:center; justify-content:center; }
 .edit-overlay.active { display:flex; }

 .edit-modal {
 background:#fff; border-radius:22px; padding:2.2rem;
 width:440px; max-width:92vw;
 box-shadow:0 24px 70px rgba(0,0,0,.2);
 animation:popIn .28s cubic-bezier(.34,1.56,.64,1);
 }
 .edit-modal h3 { font-family:'DM Sans',sans-serif; font-size:1.3rem; font-weight:800; color:#16132b; margin-bottom:1.4rem; }

 .edit-field { margin-bottom:1.1rem; }
 .edit-field label { display:block; font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:#9ca3af; margin-bottom:.45rem; }
 .edit-field input, .edit-field select, .edit-field textarea {
 width:100%; border:1.5px solid #e4dffa; border-radius:11px;
 padding:.72rem 1rem; font-size:.95rem; font-family:'DM Sans',sans-serif;
 color:#16132b; outline:none; transition:border-color .2s; background:#faf9ff;
 }
 .edit-field input:focus, .edit-field select:focus, .edit-field textarea:focus { border-color:#7c3aed; background:#fff; }
 .edit-field textarea { resize:vertical; min-height:80px; }

 .edit-actions { display:flex; gap:.7rem; margin-top:1.4rem; }
 .edit-btn { flex:1; padding:.72rem; border:none; border-radius:12px; font-size:.95rem; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; transition:opacity .2s; }
 .edit-btn.save { background:#7c3aed; color:white; }
 .edit-btn.cancel { background:#f0ecff; color:#555; }
 .edit-btn:hover { opacity:.88; }

 /* Scrollable right column */
 .profile-right { display:flex; flex-direction:column; gap:1.5rem; }

 /* empty states */
 .p-empty { text-align:center; padding:1.8rem 1rem; color:#c4b5fd; font-size:.92rem; }
 .p-empty .p-empty-icon { font-size:2rem; margin-bottom:.5rem; }

 /* view all link */
 .view-all-link { font-size:.8rem; font-weight:700; color:#7c3aed; text-decoration:none; }
 .view-all-link:hover { text-decoration:underline; }
 </style>
</head>
<body>
<script src="api.js?v=9"></script>
<script src="script.js?v=11"></script>
<script src="portal-sidebar.js?v=13"></script>
<!-- TOPBAR -->
<div class="topbar">
 <a class="topbar-logo" href="index.html"><div class="topbar-logo-gem"><img src="Prismcrys.png" style="width:100%;height:100%;object-fit:contain;display:block;" alt="PRISM"/></div>PRISM</a>
 <div class="topbar-spacer"></div>
 <div class="topbar-right">
 <span class="topbar-role-badge" id="topbar-role"></span>
 <span class="topbar-name" id="topbar-name"></span>
 <a class="topbar-avatar" href="profile.html" id="topbar-avatar">U</a>
 </div>
</div>

<div class="app-layout">

 <!-- SIDEBAR -->
 <aside class="sidebar">
 <div id="sidebar-user-card" class="sidebar-user-card"></div>
 <div id="sidebar-nav"></div>
 <div class="sidebar-divider"></div>
 <div class="sidebar-section">
 <div class="sidebar-section-label">My Classes</div>
 <div id="sidebar-classes"></div>
 </div>
 <div style="margin-top:auto;padding-top:1rem;">
 <div class="sidebar-divider"></div>
 <button type="button" class="sidebar-logout">Logout</button>
 </div>
 </aside>

 <!-- MAIN -->
 <main class="main-content">

 <!-- HERO -->
 <div class="profile-hero" id="profile-hero">
 <button class="edit-profile-btn" onclick="openEditModal()"> Edit Profile</button>
 <div class="profile-hero-inner">

 <div class="profile-avatar-wrap">
 <div class="profile-avatar" id="profile-avatar-display" onclick="document.getElementById('avatar-upload').click()">
 <img id="avatar-img" src="" alt=""/>
 <span id="avatar-initial">U</span>
 </div>
 <div class="avatar-edit-btn" onclick="document.getElementById('avatar-upload').click()"></div>
 <input type="file" id="avatar-upload" accept="image/*" onchange="handleAvatarUpload(event)"/>
 </div>

 <div class="profile-info">
 <div class="profile-name" id="display-name">Loading</div>
 <div class="profile-id" id="display-id"></div>
 <div class="profile-badges">
 <span class="p-badge role" id="display-role">student</span>
 <span class="p-badge section" id="display-section"></span>
 <span class="p-badge standing" id="display-standing">Good Standing</span>
 </div>
 <div id="display-bio" style="font-size:.92rem;color:rgba(255,255,255,.7);max-width:480px;line-height:1.65;"></div>
 </div>

 <div class="hero-stats" id="hero-stats">
 <!-- filled by JS -->
 </div>
 </div>
 </div>

 <!-- BODY GRID -->
 <div class="profile-grid">

 <!-- LEFT COLUMN -->
 <div style="display:flex;flex-direction:column;gap:1.5rem;">

 <!-- Personal Info -->
 <div class="p-card">
 <div class="p-card-header">
 <div class="p-card-title">Personal Info</div>
 </div>
 <div class="p-card-body">
 <div class="info-row">
 <div class="info-icon"></div>
 <div><div class="info-label">Full Name</div><div class="info-value" id="info-name"></div></div>
 </div>
 <div class="info-row">
 <div class="info-icon"></div>
 <div><div class="info-label">ID</div><div class="info-value" id="info-id" style="font-family:monospace"></div></div>
 </div>
 <div class="info-row">
 <div class="info-icon"></div>
 <div><div class="info-label">Role</div><div class="info-value" id="info-role"></div></div>
 </div>
 <div class="info-row">
 <div class="info-icon"></div>
 <div><div class="info-label">Section / Dept.</div><div class="info-value" id="info-section"></div></div>
 </div>
 <div class="info-row">
 <div class="info-icon"></div>
 <div><div class="info-label">Member Since</div><div class="info-value" id="info-since"></div></div>
 </div>
 </div>
 </div>

 <!-- Subject Progress -->
 <div class="p-card">
 <div class="p-card-header">
 <div class="p-card-title">Subject Progress</div>
 </div>
 <div class="p-card-body" id="subject-progress">
 <!-- filled by JS -->
 </div>
 </div>

 <!-- Quick Stats -->
 <div class="p-card">
 <div class="p-card-header">
 <div class="p-card-title">Quick Stats</div>
 </div>
 <div class="p-card-body">
 <div class="stat-chips" id="stat-chips">
 <!-- filled by JS -->
 </div>
 </div>
 </div>

 </div>

 <!-- RIGHT COLUMN -->
 <div class="profile-right">

 <!-- Quiz Performance -->
 <div class="p-card">
 <div class="p-card-header">
 <div class="p-card-title">Quiz Performance</div>
 <a class="view-all-link" href="quizzes.html">View All </a>
 </div>
 <div class="p-card-body">
 <div class="quiz-status-list" id="quiz-status-list">
 <!-- filled by JS -->
 </div>
 </div>
 </div>

 <!-- Pending & Overdue Assignments -->
 <div class="p-card">
 <div class="p-card-header">
 <div class="p-card-title">Assignments</div>
 <a class="view-all-link" href="index.html">Go to Classes </a>
 </div>
 <div class="p-card-body">
 <div class="asgn-list" id="asgn-list">
 <!-- filled by JS -->
 </div>
 </div>
 </div>

 <!-- Recent Activity -->
 <div class="p-card">
 <div class="p-card-header">
 <div class="p-card-title">Recent Activity</div>
 </div>
 <div class="p-card-body" style="padding-top:.5rem;padding-bottom:.5rem;">
 <div class="activity-feed" id="activity-feed">
 <!-- filled by JS -->
 </div>
 </div>
 </div>

 </div>
 </div>

 </main>
</div>

<!-- EDIT PROFILE MODAL -->
<div class="edit-overlay" id="edit-overlay">
 <div class="edit-modal">
 <h3> Edit Profile</h3>
 <div class="edit-field"><label>Display Name</label><input type="text" id="edit-name" placeholder="Your full name"/></div>
 <div class="edit-field"><label>Section / Program</label><input type="text" id="edit-section" placeholder="e.g. BSIT 1-A"/></div>
 <div class="edit-field"><label>About Me / Bio</label><textarea id="edit-bio" placeholder="Write a short bio about yourself"></textarea></div>
 <div class="edit-actions">
 <button class="edit-btn cancel" onclick="closeEditModal()">Cancel</button>
 <button class="edit-btn save" onclick="saveProfile()">Save Changes</button>
 </div>
 </div>
</div>

<script src="pages/profile.js?v=12"></script>
</body>
</html>
