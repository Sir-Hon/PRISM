<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM — Status</title>
  <link rel="icon" type="image/png" href="Prismcrys.png"/>
  <link rel="stylesheet" href="portal.css?v=13"/>
  <script src="portal-mobile.js?v=4" defer></script>
  <style>
    .status-wrap { max-width: 1100px; }
    .status-lead { color:#6b7280; font-size:.92rem; margin:0 0 1rem; }
    .status-search { width:100%; max-width:420px; border:1.5px solid #e4dffa; border-radius:12px; padding:.7rem .85rem; font-family:'DM Sans',sans-serif; font-size:.95rem; color:#16132b; background:#fff; margin-bottom:.85rem; }
    .status-count { font-size:.78rem; color:#9ca3af; margin:0 0 .7rem; }
    .status-list { display:flex; flex-direction:column; gap:.55rem; margin-bottom:1rem; }
    .status-card { text-align:left; background:#fff; border:1px solid rgba(124,58,237,.16); border-radius:12px; padding:.85rem 1rem; cursor:pointer; font-family:'DM Sans',sans-serif; color:#16132b; }
    .status-card strong { display:block; font-size:1rem; }
    .status-card .meta { color:#6b7280; font-size:.82rem; margin-top:.15rem; }
    .status-card .chips { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.45rem; }
    .status-card .chip { font-size:.72rem; font-weight:700; padding:.18rem .5rem; border-radius:999px; background:#f5f3ff; color:#6d28d9; }
    .status-card .chip.waiting { background:#f3f4f6; color:#6b7280; }
    .status-card.active { border-color:#7c3aed; box-shadow:0 0 0 3px rgba(124,58,237,.12); }
    .status-empty { color:#6b7280; font-size:.92rem; margin:.4rem 0 1rem; }
    .status-tabs { display:flex; gap:.4rem; margin:.2rem 0 .8rem; }
    .status-tab { border:1px solid #ddd6fe; background:#fff; color:#6d28d9; border-radius:999px; padding:.4rem .85rem; font-family:'DM Sans',sans-serif; font-weight:700; cursor:pointer; }
    .status-tab.active { background:#7c3aed; color:#fff; border-color:#7c3aed; }
    .paper { background:#fffdfb; color:#1f1630; border:1px solid #eadff2; border-radius:14px; padding:1rem 1rem 1.2rem; }
    .paper-title { font-family:'Segoe Script','Brush Script MT',cursive; font-size:1.7rem; color:#5b3d73; line-height:1.1; }
    .paper-year, .paper-teacher { font-size:.82rem; color:#7c6a86; margin-bottom:.35rem; }
    .paper-head { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:.55rem; margin:.7rem 0 .8rem; }
    .paper-head label { display:block; font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#9a6ea8; margin-bottom:.2rem; }
    .paper-value { border:1px solid #e7d5ee; background:#fff; border-radius:8px; padding:.4rem .5rem; min-height:2rem; color:#1f1630; font-size:.85rem; }
    .legend { display:flex; flex-wrap:wrap; gap:.45rem .8rem; font-size:.75rem; color:#6b5478; margin-bottom:.6rem; }
    .legend b { color:#5b3d73; }
    .att-scroll, .score-scroll { overflow-x:auto; }
    .att-table, .score-table { border-collapse:collapse; width:max-content; min-width:100%; }
    .att-table th, .att-table td, .score-table th, .score-table td { border:1px solid #ead7f0; background:#fff; text-align:center; padding:.15rem; color:#1f1630; }
    .att-table th { background:#f8eef6; font-size:.68rem; font-weight:800; color:#6b4c7a; }
    .att-table .month { text-align:left; padding:.25rem .45rem; font-size:.75rem; white-space:nowrap; background:#f8eef6; }
    .mark-cell { min-width:30px; width:30px; }
    .mark-cell .wd { display:block; font-size:.55rem; line-height:1; color:#a78bba; }
    .mark-cell.weekend { background:#f6f4f8; }
    .mark-cell.invalid { background:#f3f4f6; }
    .mark-show { display:block; font-weight:800; font-size:.78rem; color:#1f1630; min-height:1rem; }
    .mk-p { color:#047857; } .mk-a { color:#b91c1c; } .mk-l { color:#b45309; } .mk-h { color:#6d28d9; }
    .att-total { min-width:42px; font-size:.72rem; font-weight:800; background:#f8eef6; }
    .sheet-grid { display:grid; grid-template-columns:1fr 1fr; gap:.8rem; }
    .sheet-block { border:1px solid #ead7f0; border-radius:10px; overflow:hidden; background:#fff; }
    .sheet-block h3 { margin:0; padding:.45rem .65rem; background:#f8eef6; color:#6b3f86; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; }
    .score-table th { background:#fbf7fb; font-size:.65rem; font-weight:800; color:#6b4c7a; }
    .score-table td { min-width:34px; font-size:.78rem; font-weight:700; }
    .score-table .q-name { text-align:left; padding:.2rem .45rem; font-size:.75rem; white-space:nowrap; background:#fbf7fb; }
    .score-total { font-size:.75rem; font-weight:800; min-width:48px; background:#f8eef6; }
    .remarks-view { min-height:72px; font-size:.85rem; color:#1f1630; padding:.55rem .65rem; white-space:pre-wrap; }
    .sched-days { display:flex; flex-wrap:wrap; gap:.4rem; padding:.65rem; align-items:center; }
    .day-pill { border:1px solid #e7d5ee; border-radius:999px; padding:.15rem .45rem; font-size:.75rem; font-weight:800; color:#9a6ea8; }
    .day-pill.on { background:#f5f3ff; color:#6d28d9; border-color:#ddd6fe; }
    .sched-time { font-size:.85rem; color:#1f1630; }
    .avg-row { display:flex; flex-wrap:wrap; gap:.4rem; padding:.65rem; }
    .avg-box { min-width:72px; border:1px solid #ead7f0; border-radius:8px; padding:.35rem .4rem; text-align:center; background:#fff; }
    .avg-box span { display:block; font-size:.62rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; color:#9a6ea8; }
    .avg-box strong { font-size:.95rem; color:#1f1630; }
    .avg-note { margin:0; padding:0 .65rem .65rem; font-size:.72rem; color:#8b7396; }
    .sign-row { display:flex; flex-wrap:wrap; gap:.5rem; padding:.65rem; }
    .sign-row div { flex:1; min-width:140px; }
    .sign-row label { display:block; font-size:.62rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#9a6ea8; margin-bottom:.2rem; }
    html[data-theme="dark"] .status-lead,
    html[data-theme="dark"] .status-count,
    html[data-theme="dark"] .status-empty { color:#d1d5db; }
    html[data-theme="dark"] .status-card { background:#221c33; color:#f3f4f6; border-color:#3f2a55; }
    html[data-theme="dark"] .status-card .meta { color:#d1d5db; }
    html[data-theme="dark"] .status-card .chip.waiting { background:#2a2438; color:#d1d5db; }
    html[data-theme="dark"] .status-tab { background:#2a2438; color:#f3f4f6; border-color:#3f2a55; }
    html[data-theme="dark"] .status-tab.active { background:#7c3aed; color:#fff; border-color:#7c3aed; }
    html[data-theme="dark"] .paper .mk-p { color:#047857 !important; }
    html[data-theme="dark"] .paper .mk-a { color:#b91c1c !important; }
    html[data-theme="dark"] .paper .mk-l { color:#b45309 !important; }
    html[data-theme="dark"] .paper .mk-h { color:#6d28d9 !important; }
    html[data-theme="dark"] .paper .wd { color:#a78bba !important; }
    @media (max-width:900px) {
      .sheet-grid { grid-template-columns:1fr; }
      .paper-head { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:640px) {
      .status-search { max-width:none; }
      .paper-head { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
<script src="api.js?v=15"></script>
<script src="script.js?v=14"></script>
<script src="portal-sidebar.js?v=16"></script>
<div class="topbar">
  <a class="topbar-logo" href="index.html"><div class="topbar-logo-gem"><img src="Prismcrys.png" style="width:100%;height:100%;object-fit:contain;display:block;" alt="PRISM"/></div>PRISM</a>
  <div class="topbar-spacer"></div>
  <div class="topbar-right">
    <span class="topbar-role-badge" id="topbar-role"></span>
    <span class="topbar-name" id="topbar-name"></span>
    <a class="topbar-avatar" href="profile.html" id="topbar-avatar">U</a>
  </div>
</div>
<div class="app-layout">
  <aside class="sidebar">
    <div id="sidebar-user-card" class="sidebar-user-card"></div>
    <div id="sidebar-nav"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">My Classes</div>
      <div id="sidebar-classes"></div>
    </div>
    <div style="margin-top:auto;padding-top:1rem;">
      <div class="sidebar-divider"></div>
      <button type="button" class="sidebar-logout">Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="status-wrap">
      <div class="page-header"><h1>Status</h1></div>
      <p class="status-lead">Attendance and assessment records saved by your teachers. Search for a subject to open it.</p>
      <input class="status-search" id="status-search" type="text" placeholder="Search a subject, code, or teacher" autocomplete="off"/>
      <p class="status-count" id="status-count"></p>
      <div class="status-list" id="status-list"></div>
      <p class="status-empty" id="status-empty" style="display:none;"></p>
      <div class="status-tabs" id="status-tabs" style="display:none;">
        <button type="button" class="status-tab" data-kind="attendance">Attendance</button>
        <button type="button" class="status-tab" data-kind="assessment">Assessment</button>
      </div>
      <div id="status-sheet"></div>
    </div>
  </main>
</div>
<script src="pages/status.js?v=1"></script>
</body>
</html>
