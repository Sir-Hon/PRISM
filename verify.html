<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM — Verify email</title>
  <link rel="icon" type="image/png" href="Prismcrys.png"/>
  <link rel="stylesheet" href="portal.css?v=14"/>
</head>
<body>
  <div class="main" style="max-width:520px;margin:3rem auto;padding:1.5rem;">
    <h1>Email verification</h1>
    <p id="verify-msg">Checking your link…</p>
    <p><a href="login.html">Go to login</a></p>
  </div>
  <script src="api.js?v=19"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var token = params.get('token') || '';
      var msg = document.getElementById('verify-msg');
      if (!/^[a-f0-9]{64}$/.test(token)) {
        msg.textContent = 'This verification link is invalid or has expired.';
        return;
      }
      apiGet('auth', 'verify_email', { token: token }).then(function () {
        msg.textContent = 'Your email is verified. You can sign in.';
      }).catch(function (e) {
        msg.textContent = e.message || 'This verification link is invalid or has expired.';
      });
    })();
  </script>
</body>
</html>
