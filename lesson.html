<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM � Lesson plan</title>
  <link rel="icon" type="image/png" href="Prismcrys.png"/>
  <link rel="stylesheet" href="portal.css?v=14"/>
  <script src="portal-mobile.js?v=4" defer></script>
  <style>
    :root { --t:#10b981; --t-dark:#059669; --t-light:#d1fae5; }
    .class-bar { background:#fff; border-radius:12px; padding:.7rem 1rem; border:1px solid rgba(16,185,129,.14); margin-bottom:1rem; display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; }
    .t-select, .lp-input, .lp-area { border:1.5px solid #d1fae5; border-radius:10px; padding:.55rem .75rem; font-family:'DM Sans',sans-serif; font-size:.9rem; color:#16132b; outline:none; background:#fff; width:100%; box-sizing:border-box; }
    .t-select { width:auto; min-width:220px; font-weight:600; }
    .lp-area { min-height:140px; resize:vertical; }
    .t-card { background:#fff; border-radius:14px; padding:1.15rem 1.2rem; border:1px solid rgba(16,185,129,.12); margin-bottom:1rem; }
    .t-card h2 { font-family:'DM Sans',sans-serif; font-size:1rem; font-weight:800; margin:0 0 .85rem; }
    .lp-grid { display:grid; grid-template-columns:1fr 180px; gap:.7rem; }
    .lp-label { display:block; font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:#6b7280; margin-bottom:.3rem; }
    .t-btn { padding:.55rem 1.1rem; background:#10b981; color:#fff; border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:.88rem; font-weight:700; cursor:pointer; }
    .t-btn:disabled { opacity:.6; cursor:default; }
    .file-pick { border:1.5px dashed #a7f3d0; border-radius:10px; padding:.8rem; background:#f0fdf4; font-size:.85rem; color:#065f46; }
    .lp-msg { min-height:1.1em; font-size:.82rem; margin-top:.55rem; }
    .lp-msg.ok { color:#059669; }
    .lp-msg.err { color:#dc2626; }
    .lesson { border:1px solid #e5e7eb; border-radius:12px; padding:.9rem 1rem; margin-bottom:.7rem; background:#fff; }
    .lesson h3 { margin:0; font-size:1rem; }
    .lesson-meta { font-size:.78rem; color:#6b7280; margin:.2rem 0 .45rem; }
    .lesson p { margin:0 0 .6rem; white-space:pre-wrap; font-size:.9rem; line-height:1.55; }
    .lesson-files { display:flex; flex-wrap:wrap; gap:.45rem; }
    .lesson-file { display:inline-flex; align-items:center; gap:.35rem; border:1px solid #d1fae5; border-radius:8px; padding:.28rem .55rem; font-size:.78rem; font-weight:700; color:#065f46; text-decoration:none; background:#f0fdf4; }
    .lesson-file img { width:28px; height:28px; object-fit:cover; border-radius:4px; }
    .lesson-top { display:flex; justify-content:space-between; gap:.6rem; align-items:flex-start; }
    .lp-del { border:none; background:none; color:#9ca3af; font-size:.75rem; font-weight:700; cursor:pointer; }
    .lp-del:hover { color:#dc2626; }
    .empty-lessons { color:#6b7280; font-size:.9rem; padding:.4rem 0 1rem; }
    @media (max-width:640px) { .lp-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<script src="api.js?v=18"></script>
<script src="script.js?v=13"></script>
<script src="portal-sidebar.js?v=19"></script>
<div class="topbar">
  <a class="topbar-logo" href="teacher.html"><div class="topbar-logo-gem"><img src="Prismcrys.png" style="width:100%;height:100%;object-fit:contain;display:block;" alt="PRISM"/></div>PRISM</a>
  <div class="topbar-spacer"></div>
  <div class="topbar-right">
    <span class="topbar-role-badge" id="topbar-role"></span>
    <span class="topbar-name" id="topbar-name"></span>
    <a class="topbar-avatar" href="profile.html" id="topbar-avatar">T</a>
  </div>
</div>
<div class="app-layout">
  <aside class="sidebar">
    <div id="sidebar-user-card" class="sidebar-user-card"></div>
    <div id="sidebar-nav"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">Classes</div>
      <div id="sidebar-classes"></div>
    </div>
    <div style="margin-top:auto;padding-top:1rem;">
      <div class="sidebar-divider"></div>
      <button type="button" class="sidebar-logout">Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="page-header">
      <h1>Lesson plan</h1>
      <p>Write the lesson for a class and attach the PowerPoint, PDF, or images you will teach from.</p>
    </div>
    <div class="class-bar">
      <span style="font-size:.82rem;font-weight:700;color:#6b7280;">Class</span>
      <select id="class-select" class="t-select"></select>
    </div>
    <div class="t-card">
      <h2>New lesson</h2>
      <div class="lp-grid">
        <div>
          <label class="lp-label" for="lp-title">Title</label>
          <input class="lp-input" id="lp-title" type="text" maxlength="160" placeholder="e.g. Week 4 � Networking basics"/>
        </div>
        <div>
          <label class="lp-label" for="lp-date">Date</label>
          <input class="lp-input" id="lp-date" type="date"/>
        </div>
      </div>
      <div style="margin-top:.7rem;">
        <label class="lp-label" for="lp-plan">Plan</label>
        <textarea class="lp-area" id="lp-plan" placeholder="Objectives, activities, and what students should do."></textarea>
      </div>
      <div style="margin-top:.7rem;">
        <label class="lp-label" for="lp-files">Instruction materials</label>
        <div class="file-pick">
          <input id="lp-files" type="file" accept=".pdf,.ppt,.pptx,.png,.jpg,.jpeg,.gif,.webp,.bmp,image/*" multiple/>
          <div id="lp-file-names" style="margin-top:.35rem;"></div>
        </div>
      </div>
      <div style="margin-top:.8rem;">
        <button class="t-btn" id="lp-save" type="button">Save lesson</button>
      </div>
      <div class="lp-msg" id="lp-msg"></div>
    </div>
    <div id="lesson-list"></div>
  </main>
</div>
<script src="pages/lesson.js?v=1"></script>
</body>
</html>
