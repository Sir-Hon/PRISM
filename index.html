<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM — Student Dashboard</title>
  <link rel="icon" type="image/png" href="Prismcrys.png"/>
  <link rel="stylesheet" href="portal.css?v=13"/>
  <script src="portal-mobile.js?v=4" defer></script>
  <style>
    @keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }

    .student-hero {
      border-radius:12px; padding:1.5rem 1.75rem;
      background:#1e1b2e;
      color:white; margin-bottom:1.5rem; position:relative; overflow:hidden;
    }
    .student-hero::before { display:none; }
    .hero-label { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:#c4b5fd; margin-bottom:.4rem; position:relative; }
    .student-hero h1 { font-family:'DM Sans',sans-serif; font-size:1.65rem; font-weight:700; margin-bottom:.3rem; line-height:1.25; position:relative; }
    .student-hero p  { font-size:.9rem; color:rgba(255,255,255,.72); max-width:560px; position:relative; }
    .hero-gem { display:none; }

    .gc-head { display:flex; align-items:center; gap:.65rem; margin:0 0 1rem; }
    .gc-head h2 { font-family:'DM Sans',sans-serif; font-size:1.15rem; font-weight:700; color:#202124; margin:0; }
    .gc-plus { width:36px; height:36px; border-radius:50%; border:1.5px solid #dadce0; background:#fff; color:#7c3aed; font-size:1.45rem; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-family:'DM Sans',sans-serif; }
    .gc-plus:hover { background:#f5f3ff; border-color:#7c3aed; }
    .gc-create { display:none; background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:1rem; margin-bottom:1rem; max-width:420px; }
    .gc-create.open { display:block; }
    .gc-create input { width:100%; border:1px solid #dadce0; border-radius:8px; padding:.55rem .75rem; font-family:'DM Sans',sans-serif; font-size:.9rem; margin-bottom:.55rem; box-sizing:border-box; color:#16132b; background:#fff; }
    .gc-create-actions { display:flex; gap:.5rem; }
    .m-btn { flex:1; padding:.62rem; border:none; border-radius:10px; font-size:.88rem; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }
    .m-btn.primary { background:#7c3aed; color:white; }
    .m-btn.ghost { background:#f5f3ff; color:#374151; }
    .gc-grid { display:flex; flex-wrap:wrap; gap:1rem; }
    .gc-card { width:220px; max-width:100%; background:#fff; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; text-align:left; padding:0; font-family:'DM Sans',sans-serif; }
    .gc-card:hover { box-shadow:0 1px 3px rgba(60,64,67,.3); }
    .gc-card-top { height:78px; padding:.75rem .85rem; display:flex; align-items:flex-end; }
    .gc-card-title { color:#fff; font-size:.98rem; font-weight:700; line-height:1.25; }
    .gc-card-body { padding:.7rem .85rem .8rem; display:flex; align-items:center; justify-content:space-between; gap:.4rem; }
    .gc-meta { font-size:.75rem; color:#5f6368; }
    .gc-del { border:none; background:none; color:#9ca3af; font-size:.72rem; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; padding:.2rem .35rem; border-radius:6px; }
    .gc-del:hover { color:#ef4444; background:#fee2e2; }
    .gc-empty { color:#5f6368; font-size:.92rem; padding:1.5rem 0; }
    @media(max-width:640px){ .gc-card{ width:100%; } }

    .stats-row { display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:0.85rem; margin-bottom:1.5rem; }
    .stat-card { background:#fff; border-radius:10px; padding:1rem 1.15rem; box-shadow:none; border:1px solid rgba(124,58,237,.12); }
    .stat-card .sv { font-family:'DM Sans',sans-serif; font-size:1.9rem; font-weight:800; color:#7c3aed; }
    .stat-card .sl { font-size:.78rem; color:#9ca3af; font-weight:600; margin-top:2px; }

    .section-heading { font-family:'DM Sans',sans-serif; font-size:1.2rem; font-weight:800; color:#16132b; margin-bottom:1.2rem; display:flex; align-items:center; gap:.5rem; }

    .join-bar { background:#fff; border-radius:10px; padding:1rem 1.2rem; box-shadow:none; border:1px solid rgba(124,58,237,.12); margin-bottom:1.5rem; display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
    .join-input { flex:1; min-width:160px; border:1.5px solid #e4dffa; border-radius:10px; padding:.65rem 1rem; font-family:'DM Sans',sans-serif; font-size:1rem; font-weight:700; letter-spacing:.12em; color:#16132b; outline:none; text-transform:uppercase; transition:border-color .2s; }
    .join-input:focus { border-color:#7c3aed; }
    .join-btn { padding:.65rem 1.4rem; background:linear-gradient(135deg,#7c3aed,#6d28d9); color:white; border:none; border-radius:10px; font-family:'DM Sans',sans-serif; font-size:.92rem; font-weight:700; cursor:pointer; white-space:nowrap; }
    .join-btn:hover { opacity:.88; }
    .join-msg { font-size:.82rem; width:100%; }
    .join-msg.ok  { color:#10b981; }
    .join-msg.err { color:#ef4444; }

    .classes-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr)); gap:1rem; margin-bottom:2rem; }
    .class-card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:none; border:1px solid rgba(124,58,237,.12); cursor:pointer; transition:box-shadow .18s, border-color .18s; }
    .class-card:hover { box-shadow:0 8px 22px rgba(15,23,42,.08); border-color:rgba(124,58,237,.28); }
    .class-card-bar  { height:4px; }
    .class-card-body { padding:1.15rem; }
    .class-icon  { width:36px; height:36px; border-radius:8px; color:#fff; font-size:.95rem; font-weight:800; display:flex; align-items:center; justify-content:center; margin-bottom:.7rem; letter-spacing:.02em; }
    .class-name  { font-family:'DM Sans',sans-serif; font-size:1.05rem; font-weight:800; color:#16132b; margin-bottom:.35rem; }
    .class-code  { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#9ca3af; margin-bottom:.5rem; }
    .class-teacher { font-size:.82rem; color:#9ca3af; }
    .leave-btn { margin-top:.8rem; padding:.38rem .8rem; background:none; border:1px solid #fecaca; color:#ef4444; border-radius:8px; font-size:.75rem; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; }
    .leave-btn:hover { background:#fee2e2; }

    /* Class detail */
    /* Class view: fixed panel; one scroll — header, banner & tabs scroll away with content */
    .student-main-wrap { position:relative; min-height:calc(100vh - var(--topbar-h)); }
    .class-view-overlay {
      position:fixed;
      left:var(--sidebar-w);
      right:0;
      top:var(--topbar-h);
      bottom:0;
      z-index:250;
      background:#f0ecff;
      animation:fadeUp .25s ease;
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      max-height:calc(100vh - var(--topbar-h));
    }
    .class-view-overlay::-webkit-scrollbar { width:6px; }
    .class-view-overlay::-webkit-scrollbar-thumb { background:rgba(124,58,237,.25); border-radius:4px; }
    @media screen and (max-width:1023px) {
      .class-view-overlay { left:0; }
    }
    .class-view-topbar {
      height:52px; background:#fff;
      border-bottom:1px solid #e4dffa;
      display:flex; align-items:center;
      padding:0 1.4rem; gap:1rem;
    }
    .class-view-back {
      width:36px; height:36px; border-radius:50%;
      background:none; border:none; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; color:#6b7280; transition:background .15s;
    }
    .class-view-back:hover { background:#f0ecff; }
    .class-view-title { font-family:'DM Sans',sans-serif; font-size:1.1rem; font-weight:800; color:#16132b; }
    .class-view-sub   { font-size:.82rem; color:#9ca3af; }
    .class-view-banner {
      height:140px; position:relative;
      display:flex; align-items:flex-end; padding:1.25rem 1.75rem;
      overflow:hidden;
    }
    .class-view-banner::before { display:none; }
    .class-view-banner-content { position:relative; color:white; }
    .class-view-name   { font-family:'DM Sans',sans-serif; font-size:1.55rem; font-weight:700; line-height:1.2; }
    .class-view-teacher{ font-size:.95rem; opacity:.85; margin-top:.3rem; }
    .class-view-code   { 
      position:absolute; right:2rem; bottom:1.5rem;
      background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3);
      border-radius:12px; padding:.5rem 1.1rem; color:white;
      font-size:.8rem; font-weight:600;
    }
    .class-view-tabs {
      background:#fff; border-bottom:2px solid #e4dffa;
      display:flex; gap:0; padding:0 2rem;
    }
    .class-view-tab {
      padding:.85rem 1.4rem; border:none; background:none;
      font-family:'DM Sans',sans-serif; font-size:.92rem; font-weight:600;
      color:#9ca3af; cursor:pointer; border-bottom:3px solid transparent;
      margin-bottom:-2px; transition:all .15s; white-space:nowrap;
    }
    .class-view-tab:hover:not(.active) { color:#7c3aed; background:#faf8ff; }
    .class-view-tab.active { color:#7c3aed; border-bottom-color:#7c3aed; }
    .work-list { display:flex; flex-direction:column; gap:.45rem; }
    .work-row { display:flex; align-items:center; gap:.85rem; width:100%; text-align:left; background:#fff; border:1px solid #e4dffa; border-radius:12px; padding:.8rem .95rem; cursor:pointer; font-family:'DM Sans',sans-serif; color:#16132b; }
    .work-row .mat-info { flex:1; min-width:0; }
    .work-row:hover { border-color:#c4b5fd; }
    .work-status { font-size:.72rem; font-weight:800; border-radius:999px; padding:.22rem .6rem; flex-shrink:0; }
    .work-status.due { background:#fef3c7; color:#92400e; }
    .work-status.missing { background:#fee2e2; color:#991b1b; }
    .work-status.done { background:#d1fae5; color:#065f46; }
    .stream-post-focus { box-shadow:0 0 0 3px rgba(124,58,237,.35); }
    html[data-theme="dark"] .work-row { background:#221627; border-color:#3f2a44; color:#f3f4f6; }
    html[data-theme="dark"] .work-row .mat-title { color:#f3f4f6; }
    html[data-theme="dark"] .work-status.due { background:#451a03; color:#fde68a; }
    html[data-theme="dark"] .work-status.missing { background:#450a0a; color:#fecaca; }
    html[data-theme="dark"] .work-status.done { background:#052e16; color:#bbf7d0; }
    .class-view-body {
      padding:2rem;
    }
    .class-view-content { width:100%; max-width:none; margin:0; padding:0 .25rem; box-sizing:border-box; }

    /* Stream */
    .stream-post { background:#faf9ff; border-radius:14px; padding:1.1rem 1.3rem; margin-bottom:.8rem; border:1px solid #f0ecff; }
    .post-header { display:flex; align-items:center; gap:.7rem; margin-bottom:.6rem; flex-wrap:wrap; }
    .post-avatar { width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#10b981,#059669); color:white; display:flex; align-items:center; justify-content:center; font-family:'DM Sans',sans-serif; font-weight:800; font-size:.82rem; flex-shrink:0; }
    .post-meta .post-author { font-size:.88rem; font-weight:700; color:#16132b; }
    .post-meta .post-date   { font-size:.72rem; color:#9ca3af; }
    .post-badge { font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:20px; text-transform:uppercase; }
    .post-badge.announcement { background:#dbeafe; color:#1d4ed8; }
    .post-badge.material     { background:#d1fae5; color:#065f46; }
    .post-badge.assignment   { background:#fce7f3; color:#9d174d; }
    .post-badge.quiz         { background:#ede9fe; color:#5b21b6; }
    .post-body { font-size:.92rem; color:#374151; line-height:1.7; }
    .post-attach { display:inline-flex; align-items:center; gap:.4rem; margin-top:.7rem; background:#f0fdf4; padding:.4rem .85rem; border-radius:9px; font-size:.82rem; color:#065f46; font-weight:600; border:1px solid #d1fae5; }

    /* Quiz items */
    .quiz-item { display:flex; align-items:center; gap:1rem; padding:.9rem 1.1rem; border:1.5px solid #e4dffa; border-radius:12px; margin-bottom:.6rem; background:#faf9ff; flex-wrap:wrap; }
    .quiz-item-info { flex:1; min-width:0; }
    .quiz-item-title { font-weight:700; font-size:.92rem; color:#16132b; }
    .quiz-item-meta  { font-size:.75rem; color:#9ca3af; margin-top:.2rem; }
    .take-btn { padding:.45rem 1rem; background:linear-gradient(135deg,#7c3aed,#6d28d9); color:white; border:none; border-radius:9px; font-size:.82rem; font-weight:700; cursor:pointer; font-family:'DM Sans',sans-serif; white-space:nowrap; }
    .take-btn.done { background:#d1fae5; color:#065f46; pointer-events:none; }

    /* Assignment items */
    .asgn-item { display:flex; align-items:center; gap:.9rem; padding:.9rem 1.1rem; border:1.5px solid #fce7f3; border-radius:12px; margin-bottom:.6rem; background:#fff5f9; flex-wrap:wrap; }
    .asgn-info { flex:1; min-width:0; }
    .asgn-title { font-weight:700; font-size:.9rem; color:#16132b; }
    .asgn-meta  { font-size:.75rem; color:#9ca3af; margin-top:2px; }
    .asgn-due   { font-size:.78rem; font-weight:700; color:#9d174d; white-space:nowrap; }
    .asgn-due.overdue { color:#ef4444; }

    /* Assignment tab: one block per assignment name — expand to see submission, then Open for full view */
    .student-asgn-acc { border:1.5px solid #fbcfe8; border-radius:12px; margin-bottom:.65rem; background:#fffafd; overflow:hidden; }
    .student-asgn-acc > summary { list-style:none; display:flex; align-items:center; gap:.9rem; padding:.9rem 1.1rem; cursor:pointer; user-select:none; }
    .student-asgn-acc > summary::-webkit-details-marker { display:none; }
    .student-asgn-acc > summary::after { content:'▸'; margin-left:auto; font-size:.72rem; color:#9ca3af; flex-shrink:0; transition:transform .18s; }
    .student-asgn-acc[open] > summary::after { content:'▾'; }
    .student-asgn-acc-body { padding:0 1.1rem 1rem; border-top:1px solid #fce7f3; background:linear-gradient(180deg,#fff 0%,#fffafd 100%); }
    .student-asgn-acc-hint { font-size:.72rem; color:#9ca3af; margin-bottom:.55rem; padding-top:.75rem; }

    .mat-item { display:flex; align-items:center; gap:.9rem; padding:.9rem 1.1rem; border:1.5px solid #e4dffa; border-radius:12px; margin-bottom:.6rem; background:#faf9ff; flex-wrap:wrap; }
    .mat-icon-box { width:38px; height:38px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:.68rem; font-weight:800; letter-spacing:.04em; color:#5b21b6; flex-shrink:0; overflow:hidden; }
    .mat-icon-box img { width:100%; height:100%; object-fit:cover; }
    .mat-info { flex:1; min-width:0; }
    .mat-title { font-weight:700; font-size:.9rem; color:#16132b; }
    .mat-meta  { font-size:.75rem; color:#9ca3af; margin-top:2px; }
    .student-mat-acc { border:1.5px solid #e4dffa; border-radius:12px; margin-bottom:.65rem; background:#faf9ff; overflow:hidden; }
    .student-mat-acc > summary { list-style:none; display:flex; align-items:center; gap:.9rem; padding:.9rem 1.1rem; cursor:pointer; user-select:none; }
    .student-mat-acc > summary::-webkit-details-marker { display:none; }
    .student-mat-acc > summary::after { content:'View'; margin-left:auto; font-size:.72rem; font-weight:800; color:#6d28d9; background:#ede9fe; border-radius:999px; padding:.22rem .6rem; flex-shrink:0; }
    .student-mat-acc[open] > summary::after { content:'Hide'; }
    .student-mat-body { padding:.85rem 1.1rem 1rem; border-top:1px solid #efe9fb; }
    .student-mat-note { font-size:.9rem; line-height:1.6; color:#1f1630; white-space:pre-wrap; margin:0 0 .75rem; }
    .student-mat-note:last-child { margin-bottom:0; }
    .student-mat-group { margin-top:.9rem; }
    .student-mat-group:first-child { margin-top:0; }
    .student-mat-group-label { font-size:.68rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#6d28d9; margin:0 0 .4rem; }
    .student-mat-piece { margin:0 0 .55rem; padding:.65rem .7rem; border:1px solid #ddd6fe; border-radius:12px; background:#fff; }
    .student-mat-piece.is-video { width:280px; max-width:100%; }
    .student-mat-piece-label { font-size:.72rem; font-weight:700; color:#6b7280; margin-bottom:.4rem; }
    .student-mat-media { max-width:100%; max-height:220px; border-radius:8px; border:1px solid #e4dffa; display:block; }
    .student-mat-frame { width:100%; height:220px; border:1px solid #e4dffa; border-radius:8px; background:#fff; }
    .student-mat-video { width:100%; max-height:158px; border-radius:8px; background:#0f172a; display:block; }
    .student-mat-embed { position:relative; width:100%; height:158px; overflow:hidden; border-radius:8px; background:#0f172a; }
    .student-mat-embed iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
    .student-mat-file, .student-mat-link { display:block; margin-top:.45rem; padding:.55rem .7rem; border-radius:10px; background:#fff; border:1px solid #e4dffa; color:#5b21b6; font-size:.84rem; font-weight:700; text-decoration:none; word-break:break-word; }
    .student-mat-file { width:100%; text-align:left; font-family:'DM Sans',sans-serif; cursor:pointer; }
    html[data-theme="dark"] .student-mat-piece { background:#1a1220; border-color:#3f2a44; }
    html[data-theme="dark"] .student-mat-group-label,
    html[data-theme="dark"] .student-mat-piece-label { color:#ddd6fe; }
    html[data-theme="dark"] .student-mat-acc { background:#221627; border-color:#3f2a44; }
    html[data-theme="dark"] .student-mat-acc .mat-title,
    html[data-theme="dark"] .student-mat-note,
    html[data-theme="dark"] .student-mat-file,
    html[data-theme="dark"] .student-mat-link { color:#f3f4f6; }
    html[data-theme="dark"] .student-mat-body { border-color:#3f2a44; }
    html[data-theme="dark"] .student-mat-acc > summary::after { background:#3b0764; color:#f3f4f6; }
    html[data-theme="dark"] .student-mat-file,
    html[data-theme="dark"] .student-mat-link { background:#1c1524; border-color:#3f2a44; }

    .student-asgn-modal-overlay { position:fixed; inset:0; background:rgba(22,19,43,.55); z-index:10050; display:flex; align-items:flex-start; justify-content:center; padding:1.2rem; overflow-y:auto; box-sizing:border-box; }
    .student-asgn-modal { background:#fff; border-radius:16px; max-width:620px; width:100%; margin:auto; box-shadow:0 20px 50px rgba(0,0,0,.2); padding:1.25rem 1.35rem 1.4rem; position:relative; border:1px solid #fce7f3; }
    /* Attachments (Classroom-style) */
    .gc-files-section { background:#f1f3f4; border-radius:12px; padding:.85rem 1rem; margin-top:.55rem; }
    .gc-files-label { font-size:.72rem; font-weight:700; color:#5f6368; letter-spacing:.06em; text-transform:uppercase; margin-bottom:.65rem; }
    .gc-attach-card { display:flex; align-items:stretch; gap:0; background:#fff; border-radius:10px; border:1px solid #dadce0; margin-bottom:.5rem; overflow:hidden; transition:box-shadow .15s; }
    .gc-attach-card:last-child { margin-bottom:0; }
    .gc-attach-card:hover { box-shadow:0 1px 6px rgba(60,64,67,.15); }
    .gc-attach-bar { width:4px; flex-shrink:0; background:#1a73e8; }
    .gc-attach-preview { width:100px; min-height:76px; flex-shrink:0; background:#e8eaed; display:flex; align-items:center; justify-content:center; overflow:hidden; cursor:pointer; }
    .gc-attach-preview img { width:100%; height:100%; max-height:104px; object-fit:cover; }
    .gc-attach-preview.gc-doc { cursor:pointer; font-size:1.85rem; }
    .gc-attach-body { flex:1; min-width:0; padding:.65rem .85rem; display:flex; flex-direction:column; justify-content:center; gap:.35rem; }
    .gc-attach-name { font-size:.86rem; font-weight:600; color:#202124; word-break:break-word; line-height:1.35; }
    .gc-attach-actions { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; }
    .gc-attach-open { padding:.28rem .75rem; border-radius:6px; border:1px solid #dadce0; background:#fff; font-size:.74rem; font-weight:600; color:#1a73e8; cursor:pointer; font-family:'DM Sans',sans-serif; }
    .gc-attach-open:hover { background:#f8f9fa; }
    .gc-attach-dl { font-size:.72rem; font-weight:600; color:#5f6368; text-decoration:none; }
    .gc-attach-dl:hover { color:#1a73e8; text-decoration:underline; }
    .gc-link-row { display:flex; align-items:stretch; gap:0; background:#fff; border:1px solid #dadce0; border-radius:10px; margin-bottom:.5rem; overflow:hidden; }
    .gc-link-row .gc-attach-bar { width:4px; flex-shrink:0; background:#1a73e8; }
    .gc-link-body { flex:1; min-width:0; padding:.65rem .85rem; }
    .gc-link-body a { font-size:.82rem; font-weight:600; color:#1a73e8; word-break:break-all; }
    .student-asgn-modal-close { position:absolute; top:.65rem; right:.65rem; width:2rem; height:2rem; border:none; border-radius:10px; background:#f3f4f6; color:#374151; font-size:1.15rem; line-height:1; cursor:pointer; font-weight:700; }
    .student-asgn-modal-close:hover { background:#e5e7eb; }

    .bottom-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.4rem; }
    @media(max-width:860px){ .bottom-grid{ grid-template-columns:1fr; } }
    @media(max-width:640px){
      .stats-row{ grid-template-columns:1fr 1fr; }
      .classes-grid { grid-template-columns: 1fr; }
      .class-view-banner { height: auto; min-height: 110px; padding: 1rem; flex-direction: column; align-items: flex-start; }
      .class-view-name { font-size: 1.25rem; }
