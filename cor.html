<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PRISM � Certificate of Registration</title>
  <link rel="icon" type="image/png" href="Prismcrys.png"/>
  <link rel="stylesheet" href="portal.css?v=14"/>
  <script src="portal-mobile.js?v=4" defer></script>
  <style>
    .cor-wrap { max-width: 980px; }
    .cor-lead { color:#6b7280; font-size:.92rem; margin:0 0 1rem; }
    .cor-choices { display:flex; flex-direction:column; gap:.55rem; margin-bottom:1rem; }
    .cor-choice { text-align:left; background:#fff; border:1px solid rgba(124,58,237,.16); border-radius:12px; padding:.85rem 1rem; cursor:pointer; font-family:'DM Sans',sans-serif; }
    .cor-choice strong { display:block; color:#16132b; font-size:1rem; }
    .cor-choice span { color:#9ca3af; font-size:.78rem; }
    .cor-choice.active { border-color:#7c3aed; box-shadow:0 0 0 3px rgba(124,58,237,.12); }
    .cor-actions { display:flex; gap:.6rem; flex-wrap:wrap; margin:.4rem 0 1rem; }
    .cor-btn { border:none; border-radius:10px; padding:.6rem 1rem; font-family:'DM Sans',sans-serif; font-weight:700; cursor:pointer; background:#7c3aed; color:#fff; }
    .cor-btn.ghost { background:#fff; color:#6d28d9; border:1px solid #ddd6fe; }
    .cor-card { background:#fff; border:1px solid rgba(124,58,237,.12); border-radius:14px; padding:1rem 1.1rem; margin-bottom:1rem; color:#16132b; }
    .cor-card h2 { color:#16132b; }
    .cor-grid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem .9rem; }
    .cor-field { display:flex; flex-direction:column; gap:.28rem; }
    .cor-field.full { grid-column:1 / -1; }
    .cor-field label { font-size:.68rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:#9ca3af; }
    .cor-field input, .cor-field select { border:1.5px solid #e4dffa; border-radius:10px; padding:.55rem .7rem; font-family:'DM Sans',sans-serif; font-size:.92rem; color:#16132b; background:#fff; }
    .sub-table, .fee-table { width:100%; border-collapse:collapse; }
    .sub-table th, .fee-table th { text-align:left; font-size:.68rem; letter-spacing:.04em; text-transform:uppercase; color:#9ca3af; padding:.25rem; }
    .sub-table td, .fee-table td { padding:.2rem; }
    .sub-table input, .fee-table input { width:100%; border:1px solid #e4dffa; border-radius:8px; padding:.4rem .45rem; font-family:'DM Sans',sans-serif; font-size:.82rem; color:#16132b; }
    .cor-msg { font-size:.85rem; margin:.4rem 0 .8rem; }
    .cor-msg.ok { color:#047857; }
    .cor-msg.err { color:#b91c1c; }
    .sent-row { display:flex; justify-content:space-between; gap:.6rem; padding:.55rem 0; border-bottom:1px solid #f3eefb; font-size:.86rem; }
    .cor-doc { background:#fff; color:#111; border:1px solid #d1d5db; padding:1.15rem 1rem 1.5rem; font-family:Arial, Helvetica, sans-serif; }
    .cor-top { position:relative; text-align:center; min-height:2.6rem; margin-bottom:.35rem; }
    .cor-stamp { position:absolute; right:0; top:0; font-size:.72rem; }
    .cor-doc h1 { text-align:center; font-size:1.02rem; letter-spacing:.03em; margin:0; text-transform:uppercase; font-weight:700; color:#111; }
    .cor-term { text-align:center; font-size:.84rem; margin-top:.15rem; }
    .cor-idline { display:flex; gap:.35rem 1.1rem; flex-wrap:wrap; align-items:baseline; font-size:.78rem; margin:.45rem 0 .55rem; }
    .cor-idline .cor-name { flex:1 1 220px; }
    .cor-idline .cor-block { margin-left:auto; font-weight:700; }
    .cor-split { display:grid; grid-template-columns:minmax(0,1.75fr) minmax(180px,.72fr); gap:.85rem; align-items:start; }
    .cor-doc table { width:100%; border-collapse:collapse; font-size:.68rem; margin:0; }
    .cor-doc th, .cor-doc td { border:none; padding:.16rem .22rem; text-align:left; vertical-align:top; color:#111; background:transparent; }
    .cor-doc th { font-weight:700; border-bottom:1px solid #111; }
    .cor-doc td.num, .cor-doc th.num { text-align:right; white-space:nowrap; }
    .cor-sign { display:flex; gap:2.5rem; margin-top:2.2rem; font-size:.78rem; max-width:520px; }
    .cor-sign > div { flex:1; }
    .cor-sign-name { min-height:1.1rem; font-weight:700; text-transform:uppercase; }
    .cor-line { border-top:1px solid #111; padding-top:.2rem; }
    @media (max-width:720px) {
      .cor-grid, .cor-split { grid-template-columns:1fr; }
      .sub-table { display:block; overflow-x:auto; }
      .cor-idline .cor-block { margin-left:0; }
    }
    html[data-theme="dark"] .cor-card,
    html[data-theme="dark"] .cor-choice { background:#1a1d2e; color:#f3f4f6; border-color:#2e3350; }
    html[data-theme="dark"] .cor-card h2,
    html[data-theme="dark"] .cor-choice strong { color:#f3f4f6; }
    html[data-theme="dark"] .cor-field label,
    html[data-theme="dark"] .sub-table th { color:#c4c8d4; }
    html[data-theme="dark"] .sent-row { color:#f3f4f6; border-bottom-color:#2e3350; }
    html[data-theme="dark"] .cor-btn.ghost { background:#24283d; color:#e9d5ff; border-color:#3d4468; }
    html[data-theme="dark"] .cor-doc,
    html[data-theme="dark"] .cor-doc h1,
    html[data-theme="dark"] .cor-doc th,
    html[data-theme="dark"] .cor-doc td,
    html[data-theme="dark"] .cor-doc p,
    html[data-theme="dark"] .cor-doc span,
    html[data-theme="dark"] .cor-doc strong { color:#111 !important; background:transparent !important; -webkit-text-fill-color:#111; }
    html[data-theme="dark"] .cor-doc { background:#fff !important; color-scheme:light; }
    @media print {
      body * { visibility:hidden; }
      #cor-print, #cor-print * { visibility:visible; }
      #cor-print { position:absolute; left:0; top:0; width:100%; }
      .cor-doc { border:none; }
    }
  </style>
</head>
<body>
<script src="api.js?v=18"></script>
<script src="script.js?v=12"></script>
<script src="portal-sidebar.js?v=19"></script>
<div class="topbar">
  <a class="topbar-logo" href="index.html" id="cor-home"><div class="topbar-logo-gem"><img src="Prismcrys.png" style="width:100%;height:100%;object-fit:contain;display:block;" alt="PRISM"/></div>PRISM</a>
  <div class="topbar-spacer"></div>
  <div class="topbar-right">
    <span class="topbar-role-badge" id="topbar-role"></span>
    <span class="topbar-name" id="topbar-name"></span>
    <a class="topbar-avatar" href="profile.html" id="topbar-avatar">U</a>
  </div>
</div>
<div class="app-layout">
  <aside class="sidebar">
    <div id="sidebar-user-card" class="sidebar-user-card"></div>
    <div id="sidebar-nav"></div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
      <div class="sidebar-section-label">My Classes</div>
      <div id="sidebar-classes"></div>
    </div>
    <div style="margin-top:auto;padding-top:1rem;">
      <div class="sidebar-divider"></div>
      <button type="button" class="sidebar-logout">Logout</button>
    </div>
  </aside>
  <main class="main-content">
    <div class="cor-wrap">
      <div class="page-header"><h1>Certificate of Registration</h1></div>
      <div id="cor-student" style="display:none;">
        <p class="cor-lead">Choose the school year and semester, then download that certificate.</p>
        <div class="cor-choices" id="cor-choices"></div>
        <div class="cor-actions" id="cor-download-bar" style="display:none;">
          <button class="cor-btn" type="button" onclick="downloadSelectedCor()">Download</button>
        </div>
      </div>
      <div id="cor-admin" style="display:none;">
        <p class="cor-lead">Send a certificate to one student. Sending the same year and semester again replaces that copy.</p>
        <div class="cor-card" id="cor-form"></div>
        <p class="cor-msg" id="cor-msg"></p>
        <div class="cor-actions">
          <button class="cor-btn" type="button" onclick="sendCor()">Send to student</button>
          <button class="cor-btn ghost" type="button" onclick="previewAdminCor()">Preview</button>
        </div>
        <div class="cor-card" id="cor-sent-card" style="display:none;">
          <h2 style="margin:0 0 .4rem;font-size:1rem;">Sent certificates</h2>
          <div id="cor-sent"></div>
        </div>
      </div>
      <div id="cor-print"></div>
    </div>
  </main>
</div>
<script src="pages/cor.js?v=3"></script>
</body>
</html>
