<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>PRISM Calendar</title>
 <link rel="icon" type="image/png" href="Prismcrys.png"/>
 <link rel="stylesheet" href="portal.css?v=3"/>
 <script src="portal-mobile.js?v=3" defer></script>
 <style>
 :root { --cal-accent: #7c3aed; --cal-dark: #6d28d9; }

 .cal-wrap {
 background: #fff;
 border-radius: 18px;
 padding: 2rem;
 box-shadow: 0 4px 24px rgba(124,58,237,0.10);
 border: 1px solid rgba(124,58,237,0.09);
 animation: fadeUp 0.4s ease;
 }

 .cal-header {
 display: flex; align-items: center; justify-content: space-between;
 margin-bottom: 1.8rem; flex-wrap: wrap; gap: 0.8rem;
 }

 .cal-header h2 {
 font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 800; color: #16132b; margin: 0;
 }

 .cal-nav-btns { display: flex; align-items: center; gap: 0.8rem; }

 .cal-nav-btns button {
 background: var(--cal-accent); color: white; border: none;
 width: 36px; height: 36px; border-radius: 50%; font-size: 1rem;
 cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center;
 }
 .cal-nav-btns button:hover { background: var(--cal-dark); }

 #month-label {
 font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 700;
 color: #16132b; min-width: 160px; text-align: center;
 }

 .add-ev-btn {
 background: var(--cal-accent); color: white; border: none;
 padding: 0.55rem 1.3rem; border-radius: 20px; font-weight: 700;
 cursor: pointer; font-size: 0.92rem; font-family: 'DM Sans', sans-serif;
 transition: background 0.2s;
 }
 .add-ev-btn:hover { background: var(--cal-dark); }

 /* Grid */
 .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }

 .cal-day-name {
 text-align: center; font-size: 0.78rem; font-weight: 700;
 color: #9ca3af; text-transform: uppercase; padding: 0.5rem 0;
 font-family: 'DM Sans', sans-serif; letter-spacing: 0.05em;
 }

 .cal-cell {
 min-height: 88px; border-radius: 12px; padding: 7px;
 background: #faf9ff; border: 1.5px solid #f0ecff;
 cursor: pointer; transition: background 0.15s, border-color 0.15s;
 position: relative; overflow: hidden;
 }
 .cal-cell:hover { background: #f5f3ff; border-color: var(--cal-accent); }
 .cal-cell.today { background: #ede9fe; border-color: var(--cal-accent); border-width: 2px; }
 .cal-cell.other-month { opacity: 0.32; cursor: default; }
 .cal-cell.has-events { border-color: var(--cal-dark); }

 .cell-num {
 font-size: 0.85rem; font-weight: 700; color: #374151;
 font-family: 'DM Sans', sans-serif;
 }
 .cal-cell.today .cell-num {
 background: var(--cal-accent); color: white; border-radius: 50%;
 width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
 font-size: 0.82rem;
 }

 .event-dot {
 display: block; font-size: 0.7rem; border-radius: 5px; padding: 2px 5px;
 margin-top: 3px; color: white; white-space: nowrap; overflow: hidden;
 text-overflow: ellipsis; max-width: 100%;
 }

 /* Events panel */
 .events-panel { margin-top: 1.8rem; border-top: 2px solid var(--cal-accent); padding-top: 1.3rem; }
 .events-panel h3 { font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 800; color: #16132b; margin-bottom: 1rem; }

 .ev-item {
 display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1rem;
 border-radius: 11px; margin-bottom: 0.6rem; cursor: pointer;
 transition: background 0.15s; background: #faf9ff; border: 1px solid #f0ecff;
 }
 .ev-item:hover { background: #f5f3ff; border-color: var(--cal-accent); }
 .ev-color-bar { width: 5px; border-radius: 3px; align-self: stretch; min-height: 38px; }
 .ev-info { flex: 1; }
 .ev-info .ev-title { font-weight: 700; font-size: 0.95rem; color: #16132b; }
 .ev-info .ev-meta { font-size: 0.8rem; color: #9ca3af; margin-top: 1px; }
 .ev-alarm-badge { font-size: 0.72rem; background: var(--cal-accent); color: white; border-radius: 20px; padding: 2px 8px; font-weight: 700; }
 .no-events { color: #c4b5fd; font-size: 0.92rem; text-align: center; padding: 1.2rem 0; }

 /* Event modal */
 .ev-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 500; align-items: center; justify-content: center; }
 .ev-overlay.active { display: flex; }

 .ev-modal {
 background: white; border-radius: 20px; padding: 2.2rem;
 width: 420px; max-width: 92vw;
 box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1); position: relative;
 }

 .ev-modal h3 { font-family: 'DM Sans', sans-serif; font-size: 1.3rem; font-weight: 800; color: #16132b; margin-bottom: 1.3rem; }

 .ev-field { margin-bottom: 1.1rem; }
 .ev-field label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #9ca3af; margin-bottom: 0.4rem; }
 .ev-field input, .ev-field select, .ev-field textarea {
 width: 100%; border: 1.5px solid #e4dffa; border-radius: 10px;
 padding: 0.68rem 0.9rem; font-size: 0.92rem; font-family: 'DM Sans', sans-serif;
 color: #16132b; outline: none; transition: border-color 0.2s; background: #faf9ff;
 }
 .ev-field input:focus, .ev-field select:focus, .ev-field textarea:focus { border-color: var(--cal-accent); }
 .ev-field textarea { resize: vertical; min-height: 72px; }

 .color-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
 .color-chip { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s, border-color 0.2s; }
 .color-chip:hover, .color-chip.selected { transform: scale(1.2); border-color: #16132b; }

 .ev-actions { display: flex; gap: 0.7rem; margin-top: 1.3rem; }
 .ev-btn { flex: 1; padding: 0.68rem; border: none; border-radius: 11px; font-size: 0.92rem; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.2s; }
 .ev-btn:hover { opacity: 0.85; }
 .ev-btn.save { background: var(--cal-accent); color: white; }
 .ev-btn.cancel { background: #f0ecff; color: #555; }
 .ev-btn.delete { background: #ef4444; color: white; flex: 0 0 auto; padding: 0.68rem 1rem; }

 .ev-close { position: absolute; top: 1rem; right: 1rem; background: #f0ecff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; }
 .ev-close:hover { background: #ddd6fe; }

 @media(max-width:600px) { .cal-cell { min-height: 58px; } .event-dot { display: none; } }
 </style>
</head>
<body>
<script src="api.js?v=7"></script>
<script src="script.js?v=7"></script>
<script src="portal-sidebar.js?v=7"></script>
<!-- TOPBAR -->
<div class="topbar">
 <a class="topbar-logo" href="index.html"><div class="topbar-logo-gem"><img src="Prismcrys.png" style="width:100%;height:100%;object-fit:contain;display:block;" alt="PRISM"/></div>PRISM</a>
 <div class="topbar-spacer"></div>
 <div class="topbar-right">
 <span class="topbar-role-badge" id="topbar-role"></span>
 <span class="topbar-name" id="topbar-name"></span>
 <a class="topbar-avatar" href="profile.html" id="topbar-avatar">U</a>
 </div>
</div>

<div class="app-layout">
 <!-- SIDEBAR -->
 <aside class="sidebar">
 <div id="sidebar-user-card" class="sidebar-user-card"></div>
 <div id="sidebar-nav"></div>
 <div class="sidebar-divider"></div>
 <div class="sidebar-section">
 <div class="sidebar-section-label">My Classes</div>
 <div id="sidebar-classes"></div>
 </div>
 <div style="margin-top:auto;padding-top:1rem;">
 <div class="sidebar-divider"></div>
 <button type="button" class="sidebar-logout"><span class="s-icon">🚪</span> Logout</button>
 </div>
 </aside>

 <!-- MAIN -->
 <main class="main-content">
 <div class="page-header">
 <h1> Calendar</h1>
 <p>Track your events, deadlines, and reminders.</p>
 </div>

 <div class="cal-wrap">
 <div class="cal-header">
 <h2> Schedule</h2>
 <div class="cal-nav-btns">
 <button onclick="changeMonth(-1)">&#8592;</button>
 <span id="month-label"></span>
 <button onclick="changeMonth(1)">&#8594;</button>
 </div>
 <button class="add-ev-btn" onclick="openAddEvent()">+ Add Event</button>
 </div>

 <div class="cal-grid" id="cal-grid"></div>

 <div class="events-panel">
 <h3>Upcoming Events</h3>
 <div id="events-list"></div>
 </div>
 </div>
 </main>
</div>

<!-- Event Modal -->
<div class="ev-overlay" id="ev-overlay">
 <div class="ev-modal">
 <button class="ev-close" onclick="closeEvModal()"></button>
 <h3 id="ev-modal-title">Add Event</h3>
 <div class="ev-field"><label>Event Title</label><input type="text" id="ev-title" placeholder="e.g. Math Quiz, Project Deadline"/></div>
 <div class="ev-field"><label>Date</label><input type="date" id="ev-date"/></div>
 <div class="ev-field"><label>Time (optional)</label><input type="time" id="ev-time"/></div>
 <div class="ev-field"><label>Notes</label><textarea id="ev-notes" placeholder="Add any details"></textarea></div>
 <div class="ev-field">
 <label> Alarm / Reminder</label>
 <select id="ev-alarm">
 <option value="">No alarm</option>
 <option value="0">At event time</option>
 <option value="5">5 minutes before</option>
 <option value="15">15 minutes before</option>
 <option value="30">30 minutes before</option>
 <option value="60">1 hour before</option>
 <option value="1440">1 day before</option>
 </select>
 </div>
 <div class="ev-field"><label>Color</label><div class="color-row" id="color-row"></div></div>
 <div class="ev-actions" id="ev-actions">
 <button class="ev-btn cancel" onclick="closeEvModal()">Cancel</button>
 <button class="ev-btn save" onclick="saveEvent()">Save Event</button>
 </div>
 </div>
</div>






<script src="pages/calendar.js?v=7"></script>
</body>
</html>
