<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8"/>
 <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 <title>PRISM Calendar</title>
 <link rel="icon" type="image/png" href="Prismcrys.png"/>
 <link rel="stylesheet" href="portal.css?v=3"/>
 <script src="portal-mobile.js?v=3" defer></script>
 <style>
 :root { --cal-accent: #7c3aed; --cal-dark: #6d28d9; }

 .cal-wrap {
 background: #fff;
 border-radius: 18px;
 padding: 2rem;
 box-shadow: 0 4px 24px rgba(124,58,237,0.10);
 border: 1px solid rgba(124,58,237,0.09);
 animation: fadeUp 0.4s ease;
 }

 .cal-header {
 display: flex; align-items: center; justify-content: space-between;
 margin-bottom: 1.8rem; flex-wrap: wrap; gap: 0.8rem;
 }

 .cal-header h2 {
 font-family: 'DM Sans', sans-serif; font-size: 1.5rem; font-weight: 800; color: #16132b; margin: 0;
 }

 .cal-nav-btns { display: flex; align-items: center; gap: 0.8rem; }

 .cal-nav-btns button {
 background: var(--cal-accent); color: white; border: none;
 width: 36px; height: 36px; border-radius: 50%; font-size: 1rem;
 cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center;
 }
 .cal-nav-btns button:hover { background: var(--cal-dark); }

 #month-label {
 font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 700;
 color: #16132b; min-width: 160px; text-align: center;
 }

 .add-ev-btn {
 background: var(--cal-accent); color: white; border: none;
 padding: 0.55rem 1.3rem; border-radius: 20px; font-weight: 700;
 cursor: pointer; font-size: 0.92rem; font-family: 'DM Sans', sans-serif;
 transition: background 0.2s;
 }
 .add-ev-btn:hover { background: var(--cal-dark); }

 /* Grid */
 .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }

 .cal-day-name {
 text-align: center; font-size: 0.78rem; font-weight: 700;
 color: #9ca3af; text-transform: uppercase; padding: 0.5rem 0;
 font-family: 'DM Sans', sans-serif; letter-spacing: 0.05em;
 }

 .cal-cell {
 min-height: 88px; border-radius: 12px; padding: 7px;
 background: #faf9ff; border: 1.5px solid #f0ecff;
 cursor: pointer; transition: background 0.15s, border-color 0.15s;
 position: relative; overflow: hidden;
 }
 .cal-cell:hover { background: #f5f3ff; border-color: var(--cal-accent); }
 .cal-cell.today { background: #ede9fe; border-color: var(--cal-accent); border-width: 2px; }
 .cal-cell.other-month { opacity: 0.32; cursor: default; }
 .cal-cell.has-events { border-color: var(--cal-dark); }

 .cell-num {
 font-size: 0.85rem; font-weight: 700; color: #374151;
 font-family: 'DM Sans', sans-serif;
 }
 .cal-cell.today .cell-num {
 background: var(--cal-accent); color: white; border-radius: 50%;
 width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
 font-size: 0.82rem;
 }

 .event-dot {
 display: block; font-size: 0.7rem; border-radius: 5px; padding: 2px 5px;
 margin-top: 3px; color: white; white-space: nowrap; overflow: hidden;
 text-overflow: ellipsis; max-width: 100%;
 }

 /* Events panel */
 .events-panel { margin-top: 1.8rem; border-top: 2px solid var(--cal-accent); padding-top: 1.3rem; }
 .events-panel h3 { font-family: 'DM Sans', sans-serif; font-size: 1.1rem; font-weight: 800; color: #16132b; margin-bottom: 1rem; }

 .ev-item {
 display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1rem;
 border-radius: 11px; margin-bottom: 0.6rem; cursor: pointer;
 transition: background 0.15s; background: #faf9ff; border: 1px solid #f0ecff;
 }
 .ev-item:hover { background: #f5f3ff; border-color: var(--cal-accent); }
 .ev-color-bar { width: 5px; border-radius: 3px; align-self: stretch; min-height: 38px; }
 .ev-info { flex: 1; }
 .ev-info .ev-title { font-weight: 700; font-size: 0.95rem; color: #16132b; }
 .ev-info .ev-meta { font-size: 0.8rem; color: #9ca3af; margin-top: 1px; }
 .ev-alarm-badge { font-size: 0.72rem; background: var(--cal-accent); color: white; border-radius: 20px; padding: 2px 8px; font-weight: 700; }
 .no-events { color: #c4b5fd; font-size: 0.92rem; text-align: center; padding: 1.2rem 0; }

 /* Event modal */
 .ev-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 500; align-items: center; justify-content: center; }
 .ev-overlay.active { display: flex; }

 .ev-modal {
 background: white; border-radius: 20px; padding: 2.2rem;
 width: 420px; max-width: 92vw;
 box-shadow: 0 20px 60px rgba(0,0,0,0.2); animation: popIn 0.28s cubic-bezier(0.34,1.56,0.64,1); position: relative;
 }

 .ev-modal h3 { font-family: 'DM Sans', sans-serif; font-size: 1.3rem; font-weight: 800; color: #16132b; margin-bottom: 1.3rem; }

 .ev-field { margin-bottom: 1.1rem; }
 .ev-field label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: #9ca3af; margin-bottom: 0.4rem; }
 .ev-field input, .ev-field select, .ev-field textarea {
 width: 100%; border: 1.5px solid #e4dffa; border-radius: 10px;
 padding: 0.68rem 0.9rem; font-size: 0.92rem; font-family: 'DM Sans', sans-serif;
 color: #16132b; outline: none; transition: border-color 0.2s; background: #faf9ff;
 }
 .ev-field input:focus, .ev-field select:focus, .ev-field textarea:focus { border-color: var(--cal-accent); }
 .ev-field textarea { resize: vertical; min-height: 72px; }

 .color-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
 .color-chip { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: transform 0.2s, border-color 0.2s; }
 .color-chip:hover, .color-chip.selected { transform: scale(1.2); border-color: #16132b; }

 .ev-actions { display: flex; gap: 0.7rem; margin-top: 1.3rem; }
 .ev-btn { flex: 1; padding: 0.68rem; border: none; border-radius: 11px; font-size: 0.92rem; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.2s; }
 .ev-btn:hover { opacity: 0.85; }
 .ev-btn.save { background: var(--cal-accent); color: white; }
 .ev-btn.cancel { background: #f0ecff; color: #555; }
 .ev-btn.delete { background: #ef4444; color: white; flex: 0 0 auto; padding: 0.68rem 1rem; }

 .ev-close { position: absolute; top: 1rem; right: 1rem; background: #f0ecff; border: none; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #555; }
 .ev-close:hover { background: #ddd6fe; }

 @media(max-width:600px) { .cal-cell { min-height: 58px; } .event-dot { display: none; } }
 </style>
</head>
<body>
<script src="api.js"></script>

<script>
/* ── script.js inlined ── */
// ═══════════════════════════════════════════════════════
//  PRISM PORTAL — script.js  
//  Auth guard + role-based access control
// ═══════════════════════════════════════════════════════

(async function() {
  var data = await fetch(API_BASE + '/auth.php?action=session', {credentials:'include'}).then(r=>r.json()).catch(()=>({loggedIn:false}));
  if (!data.loggedIn) { window.location.replace('login.html'); return; }
  var u = data.user;
  if (['student','teacher','admin'].indexOf(u.role) === -1) {
    window.location.replace(u.role==='teacher'?'teacher.html':u.role==='admin'?'admin.html':'index.html');
    return;
  }
  sessionStorage.setItem('prism_logged_in','true');
  sessionStorage.setItem('prism_user_id',  u.id);
  sessionStorage.setItem('prism_user_name',u.name);
  sessionStorage.setItem('prism_role',     u.role);
  sessionStorage.setItem('prism_section',  u.section||'');
  function runCalendarSidebar() {
    if (typeof initSidebar === 'function') initSidebar('calendar');
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runCalendarSidebar);
  } else {
    runCalendarSidebar();
  }
})();

function getRoleHome(role) {
  if (role === 'teacher') return 'teacher.html';
  if (role === 'admin')   return 'admin.html';
  return 'index.html';
}

function logout() {
  if (!confirm('Are you sure you want to log out?')) return;
  fetch(API_BASE + '/auth.php?action=logout', {method:'POST', credentials:'include'})
    .finally(function() { sessionStorage.clear(); window.location.href = 'login.html'; });
}

function previewImage(event, imgId, placeholderId) {
  var file = event.target.files[0];
  if (!file) return;
  var img = document.getElementById(imgId);
  var placeholder = document.getElementById(placeholderId);
  var reader = new FileReader();
  reader.onload = function(e) {
    img.src = e.target.result;
    img.style.display = 'block';
    if (placeholder) placeholder.style.display = 'none';
  };
  reader.readAsDataURL(file);
}

</script>
<script>
/* ── portal-sidebar.js inlined ── */
/* portal-sidebar.js
   Call initSidebar(activePage) after DOMContentLoaded.
   Builds the correct sidebar nav for the logged-in role.
*/

var PORTAL_CLASSES = [
  { id:'math101', subject:'Mathematics',        color:'#7c3aed' },
  { id:'sci102',  subject:'Science & Tech',     color:'#0d9488' },
  { id:'eng103',  subject:'English Comm.',      color:'#d97706' },
  { id:'prog104', subject:'Programming',        color:'#2563eb' },
  { id:'hist105', subject:'Philippine History', color:'#be123c' },
  { id:'pe106',   subject:'Physical Education', color:'#15803d' },
];

var ROLE_NAV = {
  student: [
    { page:'home',     href:'index.html',    icon:'🏠', label:'Home' },
    { page:'calendar', href:'calendar.html', icon:'📅', label:'Calendar' },
    { page:'notes',    href:'notes.html',    icon:'📓', label:'Notes' },
    { page:'quizzes',  href:'quizzes.html',  icon:'🧠', label:'Quizzes' },
    { page:'call',     href:'call.html',     icon:'📞', label:'Organizations' },
  ],
  teacher: [
    { page:'home',      href:'teacher.html',   icon:'🏠', label:'My Classes' },
    { page:'quizmaker', href:'quizmaker.html', icon:'🧪', label:'Quiz Maker' },
    { page:'records',   href:'records.html',   icon:'📋', label:'Records' },
    { page:'grading',   href:'grading.html',   icon:'🎯', label:'Grading' },
    { page:'calendar',  href:'calendar.html',  icon:'📅', label:'Calendar' },
    { page:'call',      href:'call.html',      icon:'📞', label:'Organizations' },
  ],
  admin: [
    { page:'home',     href:'admin.html',    icon:'🏠', label:'Dashboard' },
    { page:'manage',   href:'manage.html',   icon:'👥', label:'Manage Users' },
    { page:'calendar', href:'calendar.html', icon:'📅', label:'Calendar' },
    { page:'call',     href:'call.html',     icon:'📞', label:'Organizations' },
  ],
};

function diamondSVG(color, size) {
  size = size || 14;
  return '<svg class="sidebar-diamond" width="'+size+'" height="'+size+'" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 1L13 7L7 13L1 7Z" fill="'+color+'" stroke="'+color+'" stroke-width="0.5" stroke-linejoin="round"/></svg>';
}

function initSidebar(activePage) {
  var uid      = sessionStorage.getItem('prism_user_id') || '';
  var profile  = JSON.parse(localStorage.getItem('prism_profile_' + uid) || '{}');
  var userName = profile.name || sessionStorage.getItem('prism_user_name') || uid || 'User';
  if (profile.name) sessionStorage.setItem('prism_user_name', profile.name);
  var roleRaw  = sessionStorage.getItem('prism_role') || 'student';
  var role     = String(roleRaw).toLowerCase().trim();
  if (!ROLE_NAV[role]) role = 'student';
  try { document.body.setAttribute('data-prism-role', role); } catch (e) {}
  var initial  = userName.charAt(0).toUpperCase();

  // ── TOPBAR LOGO — fix href and gem emoji ──
  var logoLinks = document.querySelectorAll('.topbar-logo');
  var homeHref  = role === 'admin' ? 'admin.html' : role === 'teacher' ? 'teacher.html' : 'index.html';
  for (var li = 0; li < logoLinks.length; li++) {
    logoLinks[li].href = homeHref;
    var gem = logoLinks[li].querySelector('.topbar-logo-gem');
    if (gem) {
      gem.innerHTML = '<img src="Prismcrys.png" style="width:100%;height:100%;object-fit:contain;display:block;" alt="PRISM"/>';
    }
  }

  // ── TOPBAR ──
  var tbName   = document.getElementById('topbar-name');
  var tbRole   = document.getElementById('topbar-role');
  var tbAvatar = document.getElementById('topbar-avatar');
  if (tbName)   tbName.textContent   = userName;
  if (tbRole) {
    tbRole.textContent = role;
    // Update badge color to match role
    var roleColors = { student: '#7c3aed', teacher: '#10b981', admin: '#f59e0b' };
    var roleBgs    = { student: '#ede9fe',  teacher: '#d1fae5',  admin: '#fef3c7'  };
    tbRole.style.color      = roleColors[role] || '#7c3aed';
    tbRole.style.background = roleBgs[role]    || '#ede9fe';
    tbRole.style.borderColor = (roleColors[role] || '#7c3aed') + '33';
  }
  if (tbAvatar) {
    if (profile.avatar) {
      tbAvatar.innerHTML = '<img src="'+profile.avatar+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;" alt=""/>';
    } else {
      tbAvatar.textContent = initial;
    }
  }

  // ── USER CARD — hidden in CSS (profile is in the top bar) ──
  var userCard = document.getElementById('sidebar-user-card');
  if (userCard) userCard.innerHTML = '';

  // ── NAV — replace the placeholder with the correct role nav ──
  var placeholder = document.getElementById('sidebar-nav');
  if (placeholder) {
    var links = ROLE_NAV[role] || ROLE_NAV['student'];
    var lbl   = role === 'admin' ? 'Admin' : role === 'teacher' ? 'Teacher' : 'Main';

    var sec = document.createElement('div');
    sec.className = 'sidebar-section';

    var secLbl = document.createElement('div');
    secLbl.className = 'sidebar-section-label';
    secLbl.textContent = lbl;
    sec.appendChild(secLbl);

    for (var i = 0; i < links.length; i++) {
      var l = links[i];
      if (l.placeholder) {
        var sp = document.createElement('span');
        sp.className = 'sidebar-link sidebar-link-placeholder';
        sp.setAttribute('data-page', l.page);
        sp.setAttribute('aria-disabled', 'true');
        sp.innerHTML = '<span class="s-icon">'+l.icon+'</span> '+l.label;
        sec.appendChild(sp);
      } else {
        var a = document.createElement('a');
        a.className = 'sidebar-link' + (l.page === activePage ? ' active' : '');
        a.setAttribute('data-page', l.page);
        a.href = l.href;
        a.innerHTML = '<span class="s-icon">'+l.icon+'</span> '+l.label;
        sec.appendChild(a);
      }
    }

    sec.id = 'sidebar-nav';
    placeholder.parentNode.replaceChild(sec, placeholder);
  }

  // ── MY CLASSES section ──
  var classCont = document.getElementById('sidebar-classes');
  if (classCont) {

    // Hide the whole My Classes section for admins
    if (role === 'admin') {
      var node = classCont.parentNode;
      while (node && !(node.className && node.className.indexOf('sidebar-section') !== -1)) {
        node = node.parentNode;
      }
      if (node) node.style.display = 'none';
      var prev = node && node.previousElementSibling;
      if (prev && prev.className && prev.className.indexOf('sidebar-divider') !== -1) {
        prev.style.display = 'none';
      }
      return;
    }

    // For students and teachers — show classes
    // Update section label based on role
    var classSection = classCont.parentNode;
    if (classSection) {
      var classLabel = classSection.querySelector('.sidebar-section-label');
      if (classLabel) {
        classLabel.textContent = role === 'teacher' ? 'Classes' : 'My Classes';
      }
    }

    classCont.innerHTML = '';

    if (role === 'teacher') {
      // Teacher: show their created classes
      var teacherId = sessionStorage.getItem('prism_user_id') || 'teacher';
      var teacherClasses = JSON.parse(localStorage.getItem('prism_classes_'+teacherId)||'[]');
      if (!teacherClasses.length) {
        var emp = document.createElement('div');
        emp.style.cssText = 'font-size:.78rem;color:#6b7280;padding:.4rem 1.3rem;';
        emp.textContent = 'No subjects yet';
        classCont.appendChild(emp);
      } else {
        teacherClasses.forEach(function(cls) {
          var btn = document.createElement('button');
          btn.className = 'sidebar-class-item';
          btn.innerHTML = diamondSVG(cls.color||'#7c3aed', 13) +
            '<span class="sidebar-class-name">'+cls.subject+'</span>';
          btn.onclick = function() { window.location.href = 'teacher-class.html?class=' + encodeURIComponent(cls.id); };
          classCont.appendChild(btn);
        });
      }
    } else {
      // Student: show joined classes
      var studentId = sessionStorage.getItem('prism_user_id') || 'student';
      var joinedRaw = JSON.parse(localStorage.getItem('prism_joined_'+studentId)||'{}');
      var joinedList = Object.values(joinedRaw);
      if (!joinedList.length) {
        var emp2 = document.createElement('div');
        emp2.style.cssText = 'font-size:.78rem;color:#6b7280;padding:.4rem 1.3rem;';
        emp2.textContent = 'No classes joined yet';
        classCont.appendChild(emp2);
      } else {
        var colors = ['#7c3aed','#0d9488','#d97706','#2563eb','#be123c','#15803d'];
        joinedList.forEach(function(entry, idx) {
          (function(e, i) {
            var btn = document.createElement('button');
            btn.className = 'sidebar-class-item';
            btn.innerHTML = diamondSVG(colors[i%colors.length], 13) +
              '<span class="sidebar-class-name">'+e.subject+'</span>';
            btn.onclick = function() {
              if (typeof openClassDetail === 'function') {
                openClassDetail(e.classId, e.teacherId, e.subject, colors[i%colors.length]);
              } else {
                window.location.href = 'index.html';
              }
            };
            classCont.appendChild(btn);
          })(entry, idx);
        });
      }
    }
  }
}

function logout() {
  if (!confirm('Are you sure you want to log out?')) return;
  fetch(API_BASE + '/auth.php?action=logout', {method:'POST', credentials:'include'})
    .finally(function() { sessionStorage.clear(); window.location.href = 'login.html'; });
}

</script>

<script>

 const COLORS = ['#e74c3c','#6d28d9','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#607d8b'];
 const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
 const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

 let today = new Date();
 let viewYear = today.getFullYear();
 let viewMonth = today.getMonth();
 let events = JSON.parse(localStorage.getItem('prism_events') || '[]');
 let editingId = null;
 let selColor = COLORS[2];

 // Load events from API on startup
 (async function() {
   try {
     const apiEvents = await PrismEvents.get();
     events = apiEvents.map(e => ({
       id: e.id, title: e.title, date: e.event_date,
       time: e.event_time||'', notes: e.notes||'',
       alarm: e.alarm!==null ? e.alarm : '',
       color: e.color||COLORS[2]
     }));
     localStorage.setItem('prism_events', JSON.stringify(events));
     renderCalendar();
     events.forEach(scheduleAlarm);
   } catch(ex) {
     console.warn('Could not load events from API:', ex.message);
     events.forEach(scheduleAlarm);
   }
 })();

 // Color chips
 const colorRow = document.getElementById('color-row');
 COLORS.forEach(c => {
 const chip = document.createElement('div');
 chip.className = 'color-chip'; chip.style.background = c; chip.dataset.color = c;
 chip.onclick = () => selectColor(c);
 colorRow.appendChild(chip);
 });
 selectColor(COLORS[2]);

 function selectColor(c) {
 selColor = c;
 document.querySelectorAll('.color-chip').forEach(ch => ch.classList.toggle('selected', ch.dataset.color === c));
 }

 function saveEvents() {
   localStorage.setItem('prism_events', JSON.stringify(events));
 }


 function renderCalendar() {
 const grid = document.getElementById('cal-grid');
 grid.innerHTML = '';
 document.getElementById('month-label').textContent = MONTHS[viewMonth] + ' ' + viewYear; 

 DAYS.forEach(d => {
 const el = document.createElement('div');
 el.className = 'cal-day-name'; el.textContent = d; grid.appendChild(el);
 });

 const firstDay = new Date(viewYear, viewMonth, 1).getDay();
 const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
 const daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

 for (let i = firstDay-1; i >= 0; i--) addCell(grid, daysInPrev-i, viewMonth-1, viewYear, true);
 for (let d = 1; d <= daysInMonth; d++) addCell(grid, d, viewMonth, viewYear, false);
 const total = firstDay + daysInMonth;
 const rem = total % 7 === 0 ? 0 : 7-(total%7);
 for (let d = 1; d <= rem; d++) addCell(grid, d, viewMonth+1, viewYear, true);

 renderEventsList();
 }

 function addCell(grid, day, month, year, otherMonth) {
 const rm = ((month%12)+12)%12;
 const ry = year + Math.floor(month/12);
 const ds = `${ry}-${String(rm+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
 const devs = events.filter(e => e.date === ds);
 const isTd = day===today.getDate() && rm===today.getMonth() && ry===today.getFullYear();

 const cell = document.createElement('div');
 cell.className = 'cal-cell' + (otherMonth?' other-month':'') + (isTd?' today':'') + (devs.length?' has-events':'');

 const num = document.createElement('div');
 num.className = 'cell-num'; num.textContent = day; cell.appendChild(num);

 devs.slice(0,3).forEach(ev => {
 const dot = document.createElement('span');
 dot.className = 'event-dot'; dot.textContent = ev.title; dot.style.background = ev.color || '#6d28d9';
 cell.appendChild(dot);
 });

 if (!otherMonth) cell.onclick = () => openAddEvent(ds);
 grid.appendChild(cell);
 }

 function renderEventsList() {
 const list = document.getElementById('events-list');
 const sorted = [...events].sort((a,b)=>a.date.localeCompare(b.date));
 const upcoming = sorted.filter(e => e.date >= today.toISOString().split('T')[0]);

 if (!upcoming.length) { list.innerHTML = '<div class="no-events">No upcoming events. Click a date or + Add Event to create one.</div>'; return; }
 list.innerHTML = '';
 upcoming.forEach(ev => {
 const item = document.createElement('div');
 item.className = 'ev-item'; item.onclick = () => openEditEvent(ev.id);
 const dl = new Date(ev.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
 const bar = `<div class="ev-color-bar" style="background:${ev.color||'#6d28d9'}"></div>`;
 const info = `<div class="ev-info"><div class="ev-title">${ev.title}</div><div class="ev-meta">${dl}${ev.time?' · '+fmtTime(ev.time):''}${ev.notes?' · '+ev.notes.substring(0,40):''}</div></div>`;
 const alarm = (ev.alarm!==''&&ev.alarm!==undefined) ? '<span class="ev-alarm-badge"></span>' : '';
 item.innerHTML = bar + info + alarm;
 list.appendChild(item);
 });
 }

 function fmtTime(t) {
 if (!t) return '';
 const [h,m] = t.split(':'); const hr = parseInt(h);
 return ((hr%12)||12)+':'+m+(hr>=12?' PM':' AM');
 }

 function openAddEvent(ds) {
 editingId = null;
 document.getElementById('ev-modal-title').textContent = 'Add Event';
 document.getElementById('ev-title').value = '';
 document.getElementById('ev-date').value = ds || today.toISOString().split('T')[0];
 document.getElementById('ev-time').value = '';
 document.getElementById('ev-notes').value = '';
 document.getElementById('ev-alarm').value = '';
 selectColor(COLORS[2]);
 document.getElementById('ev-actions').innerHTML = `<button class="ev-btn cancel" onclick="closeEvModal()">Cancel</button><button class="ev-btn save" onclick="saveEvent()">Save Event</button>`;
 document.getElementById('ev-overlay').classList.add('active');
 }

 function openEditEvent(id) {
 const ev = events.find(e=>e.id===id); if (!ev) return;
 editingId = id;
 document.getElementById('ev-modal-title').textContent = 'Edit Event';
 document.getElementById('ev-title').value = ev.title;
 document.getElementById('ev-date').value = ev.date;
 document.getElementById('ev-time').value = ev.time||'';
 document.getElementById('ev-notes').value = ev.notes||'';
 document.getElementById('ev-alarm').value = ev.alarm!==undefined?ev.alarm:'';
 selectColor(ev.color||COLORS[2]);
 document.getElementById('ev-actions').innerHTML = `<button class="ev-btn delete" onclick="deleteEvent('${id}')">Delete</button><button class="ev-btn cancel" onclick="closeEvModal()">Cancel</button><button class="ev-btn save" onclick="saveEvent()">Update</button>`;
 document.getElementById('ev-overlay').classList.add('active');
 }

 function closeEvModal() { document.getElementById('ev-overlay').classList.remove('active'); }

 async function saveEvent() {
   const title = document.getElementById('ev-title').value.trim();
   const date  = document.getElementById('ev-date').value;
   if (!title) { alert('Please enter an event title.'); return; }
   if (!date)  { alert('Please select a date.'); return; }
   const ev = {
     id: editingId||Date.now().toString(), title, date,
     time:  document.getElementById('ev-time').value,
     notes: document.getElementById('ev-notes').value.trim(),
     alarm: document.getElementById('ev-alarm').value,
     color: selColor
   };
   try {
     const saved = await PrismEvents.save({
       id: ev.id, title: ev.title, date: ev.date,
       time: ev.time||null, notes: ev.notes,
       alarm: ev.alarm!==''?parseInt(ev.alarm):null,
       color: ev.color
     });
     if (saved.id) ev.id = saved.id;
   } catch(e) { console.warn('API save failed:', e.message); }
   if (editingId) { events[events.findIndex(e=>e.id===editingId)] = ev; } else { events.push(ev); }
   saveEvents(); scheduleAlarm(ev); closeEvModal(); renderCalendar();
 }

 async function deleteEvent(id) {
   if (!confirm('Delete this event?')) return;
   try { await PrismEvents.delete(id); } catch(e) { console.warn('API delete failed:', e.message); }
   events = events.filter(e=>e.id!==id); saveEvents(); closeEvModal(); renderCalendar();
 }

 function changeMonth(dir) {
 viewMonth += dir;
 if (viewMonth>11){viewMonth=0;viewYear++;} if (viewMonth<0){viewMonth=11;viewYear--;}
 renderCalendar();
 }

 /** Short chime using Web Audio (works after a user gesture on most browsers). */
 function playPrismAlarmSound() {
 try {
   const AC = window.AudioContext || window.webkitAudioContext;
   if (!AC) return;
   const ctx = new AC();
   function beep(freq, t0) {
     const o = ctx.createOscillator();
     const g = ctx.createGain();
     o.connect(g);
     g.connect(ctx.destination);
     o.frequency.value = freq;
     o.type = 'sine';
     const t = ctx.currentTime + t0;
     g.gain.setValueAtTime(0.0001, t);
     g.gain.exponentialRampToValueAtTime(0.14, t + 0.02);
     g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
     o.start(t);
     o.stop(t + 0.23);
   }
   beep(880, 0);
   beep(660, 0.28);
   beep(880, 0.56);
   setTimeout(function() { ctx.close().catch(function() {}); }, 1200);
 } catch (e) { /* ignore */ }
 }

 function scheduleAlarm(ev) {
 if (!ev.time) return;
 if (ev.alarm === '' || ev.alarm === null || ev.alarm === undefined) return;
 const mins = parseInt(ev.alarm, 10);
 if (isNaN(mins)) return;
 const [y,m,d]=ev.date.split('-').map(Number), [h,min]=ev.time.split(':').map(Number);
 const diff = new Date(y,m-1,d,h,min,0).getTime() - mins*60000 - Date.now();
 if (diff>0) setTimeout(function(){
   playPrismAlarmSound();
   if (Notification.permission==='granted') new Notification('PRISM Reminder', { body: ev.title });
   else alert('Reminder: '+ev.title);
 }, diff);
 }

 if ('Notification' in window && Notification.permission==='default') Notification.requestPermission();
 document.getElementById('ev-overlay').addEventListener('click',function(e){if(e.target===this)closeEvModal();});
 renderCalendar();
</script>
